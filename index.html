const REL_PRECISA_GER = { uso:1, suporte:1, contratos:1 };
const REL_PRECISA_FIN = { dre:1, receb:1, inad:1, lojas:1, custos:1 };
const TIPO_NOME = { empresa_criada:'Loja criada', empresa_editada:'Cadastro editado', suspensa:'Suspensa', reativada:'Reativada', renovada:'Renovada', pagamento:'Pagamento', pagamento_estornado:'Pagamento estornado', contrato_encerrado:'Contrato encerrado', licenca_invalida:'Licença inválida', licenca_bloqueada:'Bloqueio aplicado', mes_fechado:'Mês fechado', mes_reaberto:'Mês reaberto' };

/* ---- bases ---- */
const fatDe = c => S.mens.filter(m=>m.competencia===c && m.situacao!=='cancelada');
const pagosEntre = (ini,fim) => S.mens.filter(m=>m.situacao==='paga' && m.pago_em && m.pago_em>=ini && m.pago_em<=fim);
const custosDe = c => S.custos.filter(k=>k.competencia===c);
const ativadaDe = e => e.ativada_em || (e.status!=='teste' ? String(e.criado_em||'').slice(0,10) || null : null);
function ativosEm(c){ const fim=ymFimISO(c); return S.empresas.filter(e=>{ const a=ativadaDe(e); return a && a<=fim && !(e.cancelado_em && e.cancelado_em<=fim); }); }
const pagantesHoje = () => S.empresas.filter(e=>!situacao(e).bloq && e.status!=='teste');
const mesesDeCasa = e => { const a=ativadaDe(e); if(!a) return null; const fim=e.cancelado_em||hojeISO(); return Math.max(0, difDias(fim,a)/30.44); };
const perIni = () => S.per.ini+'-01', perFim = () => ymFimISO(S.per.fim);
function sitTxt(e){ const s=situacao(e); if(s.enc) return ['encerrada','mut']; if(e.status==='suspensa') return ['suspensa','neg']; if(s.bloq) return ['vencida','neg']; if(s.dias!=null&&s.dias<0) return ['carência','warn']; if(s.dias!=null&&s.dias<=10) return ['vencendo','warn']; if(e.status==='teste') return ['teste','info']; return ['ativa','pos']; }
const tg = (t,k) => ({ t, k });
const hx = (h,t) => ({ h, t });

/* ---- gráficos ---- */
function niceMax(v){ if(!(v>0)) return 1; const p=10**Math.floor(Math.log10(v)), m=v/p; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p; }
function barras(labels, series){ const W=760,H=220,L=62,R=8,T=10,B=26, pw=W-L-R, ph=H-T-B;
  const max=niceMax(Math.max(0,...series.flatMap(s=>s.vals.map(v=>+v||0)))); const n=labels.length, k=series.length;
  const gw=pw/Math.max(n,1), bw=Math.max(3,Math.min(26,(gw*0.72-(k-1)*2)/k));
  const y=v=>T+ph-(Math.max(0,+v||0)/max)*ph;
  let g=''; for(let i=0;i<=4;i++){ const v=max*i/4, yy=y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${i?'#eef2f7':'#94a3b8'}" stroke-width="1"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="10.5" fill="#64748b">${BRLc(v)}</text>`; }
  const passo=n>12?Math.ceil(n/12):1; let b='';
  labels.forEach((lab,i)=>{ const gx=L+gw*i+(gw-(k*bw+(k-1)*2))/2;
    series.forEach((s,j)=>{ const v=+s.vals[i]||0; const x=gx+j*(bw+2), yy=y(v), h=T+ph-yy; const r=Math.min(4,h,bw/2);
      if(h>0) b+=`<path class="bar" d="M${x},${T+ph} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${T+ph} Z" style="fill:${s.cor}"><title>${esc(ymNome(lab))} · ${esc(s.nome)}: ${BRL(v)}</title></path>`;
      b+=`<rect x="${x-1}" y="${T}" width="${bw+2}" height="${ph}" fill="transparent"><title>${esc(ymNome(lab))} · ${esc(s.nome)}: ${BRL(v)}</title></rect>`; });
    if(i%passo===0) b+=`<text x="${L+gw*i+gw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#64748b">${esc(ymNome(lab))}</text>`; });
  const leg=k>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}</div>`:'';
  return `<div class="chart">${leg}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.nome).join(' e '))} por mês">${g}${b}</svg></div>`; }
function hbarras(itens, fmt){ const max=Math.max(0,...itens.map(i=>+i.v||0))||1; fmt=fmt||BRL;
  return itens.map(i=>`<div class="hbar"><span title="${esc(i.l)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.l)}</span><div class="trk"><span style="width:${Math.max(0,(+i.v||0)/max*100).toFixed(1)}%"></span></div><b class="small" style="font-variant-numeric:tabular-nums">${fmt(i.v)}${i.x?` <span class="mut" style="font-weight:400">${i.x}</span>`:''}</b></div>`).join('') || '<p class="mut small">Sem dados no período.</p>'; }

/* ---- tabela genérica (tela, impressão e CSV) ---- */
const NUMTIPOS = { brl:1, pct:1, int:1, dec:1 };
function celula(v,t){ if(v==null||v==='') return '<span class="mut">—</span>';
  switch(t){ case 'brl': return +v<0?`<span style="color:var(--neg)">${BRL(v)}</span>`:BRL(v); case 'pct': return +v<0?`<span style="color:var(--neg)">${PCT(v)}</span>`:PCT(v);
    case 'int': return NUM(v); case 'dec': return (+v).toLocaleString('pt-BR',{maximumFractionDigits:1}); case 'date': return fD(v); case 'ym': return ymNome(v);
    case 'tag': return `<span class="tag ${v.k}">${esc(v.t)}</span>`; case 'html': return v.h; case 'b': return `<b>${esc(v)}</b>`; default: return esc(v); } }
function celulaCSV(v,t){ if(v==null) return '';
  switch(t){ case 'brl': return (+v||0).toFixed(2).replace('.',','); case 'pct': return isFinite(v)?((+v)*100).toFixed(1).replace('.',','):''; case 'dec': return (+v).toFixed(1).replace('.',',');
    case 'date': return fD(v); case 'ym': return ymNome(v); case 'tag': case 'html': return v.t; default: return String(v); } }
function tabelaHTML(tb){ const cols=tb.cols;
  const cab=cols.map(([k,l,t])=>`<th class="${NUMTIPOS[t]?'n':''}">${esc(l)}</th>`).join('');
  const lin=tb.rows.map(r=>`<tr>${cols.map(([k,l,t])=>`<td class="${NUMTIPOS[t]?'n':''}">${celula(r[k],t)}</td>`).join('')}</tr>`).join('');
  const tot=tb.total?`<tr class="tot">${cols.map(([k,l,t],i)=>`<td class="${NUMTIPOS[t]?'n':''}">${i===0?esc(tb.total._label||'Total'):(tb.total[k]!=null?celula(tb.total[k],t):'')}</td>`).join('')}</tr>`:'';
  return `<div class="card" style="padding:0">${tb.titulo?`<h4 style="padding:12px 14px 0">${esc(tb.titulo)}</h4>`:''}${tb.sub?`<p class="sub" style="padding:0 14px">${tb.sub}</p>`:''}
    <div style="overflow-x:auto"><table><thead><tr>${cab}</tr></thead><tbody>${lin||`<tr><td colspan="${cols.length}" class="mut" style="text-align:center;padding:20px">${esc(tb.vazio||'Nada no período.')}</td></tr>`}${lin?tot:''}</tbody></table></div></div>`; }
function exportarCSV(){ const r=S._rel; if(!r) return; const q=v=>{ const s=String(v==null?'':v); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const out=[[r.titulo],[r.periodo||'']];
  (r.kpis||[]).forEach(([l,v])=>out.push([l, String(v).replace(/<[^>]+>/g,'')]));
  (r.blocos||[]).filter(b=>b.cols).forEach(tb=>{ out.push([]); out.push([tb.titulo||'']); out.push(tb.cols.map(c=>c[1]));
    tb.rows.forEach(row=>out.push(tb.cols.map(([k,l,t])=>celulaCSV(row[k],t))));
    if(tb.total) out.push(tb.cols.map(([k,l,t],i)=>i===0?(tb.total._label||'Total'):celulaCSV(tb.total[k],t))); });
  const txt='﻿'+out.map(l=>l.map(q).join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=('central-'+S.rel+'-'+hojeISO()+'.csv'); document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }

/* ---- tela ---- */
function periodoPreset(p){ const h=ymHoje(); const ano=h.slice(0,4);
  const m={ mes:[h,h], ant:[ymAdd(h,-1),ymAdd(h,-1)], m3:[ymAdd(h,-2),h], m6:[ymAdd(h,-5),h], m12:[ymAdd(h,-11),h], ano:[ano+'-01',h], anoant:[(+ano-1)+'-01',(+ano-1)+'-12'] }[p];
  if(m){ S.per.ini=m[0]; S.per.fim=m[1]; render(); } }
function periodoSet(k,v){ if(!/^\d{4}-\d{2}$/.test(v)) return; S.per[k]=v; if(S.per.ini>S.per.fim){ if(k==='ini') S.per.fim=v; else S.per.ini=v; } render(); }
function telaRelatorios(){ if(!S.per.ini){ S.per.fim=ymHoje(); S.per.ini=ymAdd(S.per.fim,-5); }
  const nav=bannerAnalitico();
  const temPer=REL_PERIODO[S.rel];
  const ctl=`<div class="toolbar noprint">${temPer?`<div class="per"><span class="small mut">De</span><input type="month" value="${S.per.ini}" onchange="periodoSet('ini',this.value)"><span class="small mut">até</span><input type="month" value="${S.per.fim}" onchange="periodoSet('fim',this.value)">
      <select onchange="periodoPreset(this.value);this.value=''"><option value="">Atalhos…</option><option value="mes">Este mês</option><option value="ant">Mês passado</option><option value="m3">Últimos 3 meses</option><option value="m6">Últimos 6 meses</option><option value="m12">Últimos 12 meses</option><option value="ano">Este ano</option><option value="anoant">Ano passado</option></select></div>`
      : S.rel==='prev'?`<div class="per"><span class="small mut">Horizonte</span><select onchange="S.prevN=+this.value;render()">${[3,6,12].map(n=>`<option value="${n}" ${S.prevN===n?'selected':''}>${n} meses</option>`).join('')}</select></div>`:`<span class="small mut">Posição de hoje, ${fD(hojeISO())}</span>`}
      <div style="margin-left:auto;display:flex;gap:6px"><button class="btn" onclick="window.print()">Imprimir / PDF</button><button class="btn" onclick="exportarCSV()">Exportar planilha (CSV)</button></div></div>`;
  if(REL_PRECISA_FIN[S.rel] && !S.finOk){ S._rel=null; return nav+avisoSql(); }
  if(REL_PRECISA_GER[S.rel] && !S.gerOk){ S._rel=null; return nav+avisoSqlGer(); }
  const fn={ dre:relDRE, receb:relReceb, inad:relInad, lojas:relLojas, custos:relCustos, prev:relPrev, saas:relSaaS, carteira:relCarteira, saude:relSaude, venc:relVenc, ocorr:relOcorr, uso:relUso, suporte:relSuporte, contratos:relContratos }[S.rel] || relDRE;
  const r=fn(); r.periodo = temPer ? ('Período: '+ymNome(S.per.ini)+(S.per.ini!==S.per.fim?' a '+ymNome(S.per.fim):'')) : (S.rel==='prev'?'Próximos '+S.prevN+' meses':'Posição em '+fD(hojeISO()));
  S._rel=r;
  return nav+ctl+`<div class="printhead"><h2 style="margin:0">Central GestãoPro — ${esc(r.titulo)}</h2><div class="small mut">${esc(r.periodo)} · emitido em ${fDH(new Date().toISOString())}</div></div>
    <div class="card"><h4>${esc(r.titulo)} <span class="mut small" style="font-weight:400">· ${esc(r.periodo)}</span></h4><p class="sub" style="margin:0">${r.desc||''}</p></div>
    ${r.kpis&&r.kpis.length?`<div class="mini">${r.kpis.map(([l,v,cor])=>`<div><small>${esc(l)}</small><b style="${cor?'color:'+cor:''}">${v}</b></div>`).join('')}</div>`:''}
    ${(r.blocos||[]).map(b=>b.cols?tabelaHTML(b):`<div class="card">${b.titulo?`<h4>${esc(b.titulo)}</h4>`:''}${b.html}</div>`).join('')}
    ${r.nota?`<p class="mut small">${r.nota}</p>`:''}`; }

/* ---- FINANCEIROS ---- */
function relDRE(){ const meses=ymLista(S.per.ini,S.per.fim);
  const rows=meses.map(c=>{ const fat=soma(fatDe(c),m=>m.valor), rec=soma(pagosEntre(c+'-01',ymFimISO(c)),m=>m.valor_pago), ks=custosDe(c);
    const imp=soma(ks.filter(k=>k.categoria==='impostos'),k=>k.valor), dir=soma(ks.filter(k=>k.tenant&&k.categoria!=='impostos'),k=>k.valor), ger=soma(ks.filter(k=>!k.tenant&&k.categoria!=='impostos'),k=>k.valor), ct=imp+dir+ger;
    const fe=S.gerOk&&S.fech.some(f=>f.competencia===c);
    return { c, fat, imp, liq:fat-imp, dir, ger, ct, res:fat-ct, marg:fat?(fat-ct)/fat:null, rec, caixa:rec-ct, fech:S.gerOk?tg(fe?'fechado':'aberto',fe?'pos':'mut'):null }; });
  const T={}; ['fat','imp','liq','dir','ger','ct','res','rec','caixa'].forEach(k=>T[k]=soma(rows,r=>r[k])); T.marg=T.fat?T.res/T.fat:null;
  return { titulo:'Resultado mensal (DRE simplificado)', desc:'Receita pela <b>competência</b> das mensalidades (canceladas ficam fora) menos impostos e custos lançados no mês. As duas últimas colunas mostram o <b>caixa</b>: o que entrou de fato (pela data do pagamento) menos os mesmos custos.',
    kpis:[['Receita faturada',BRL(T.fat)],['Recebido (caixa)',BRL(T.rec),'var(--pos)'],['Custos + impostos',BRL(T.ct)],['Resultado',BRL(T.res),T.res<0?'var(--neg)':'var(--pos)'],['Margem',PCT(T.marg)],['Resultado médio / mês',BRL(T.res/meses.length)]],
    blocos:[ { titulo:'Receita faturada x custos', html:barras(meses,[{nome:'Receita faturada',cor:'var(--s1)',vals:rows.map(r=>r.fat)},{nome:'Custos + impostos',cor:'var(--s2)',vals:rows.map(r=>r.ct)}]) },
      { titulo:'Demonstrativo por mês', cols:[['c','Mês','ym'],['fat','Receita faturada','brl'],['imp','(−) Impostos','brl'],['liq','Receita líquida','brl'],['dir','(−) Custos diretos','brl'],['ger','(−) Custos gerais','brl'],['res','Resultado','brl'],['marg','Margem','pct'],['rec','Recebido (caixa)','brl'],['caixa','Saldo de caixa','brl'],['fech','Mês','tag']], rows, total:T } ] }; }

function relReceb(){ const lista=pagosEntre(perIni(),perFim()).sort((a,b)=>a.pago_em.localeCompare(b.pago_em));
  const rows=lista.map(m=>{ const atraso=Math.max(0,difDias(m.pago_em,m.vencimento)); return { data:m.pago_em, loja:nomeDe(m.tenant), comp:m.competencia, valor:+m.valor, pago:+m.valor_pago, dif:(+m.valor_pago)-(+m.valor), forma:formaNome(m.forma), atraso, st:atraso?tg('atraso '+atraso+'d','warn'):tg('em dia','pos') }; });
  const tot=soma(rows,r=>r.pago), emDia=rows.filter(r=>!r.atraso).length, atr=rows.filter(r=>r.atraso);
  const porForma={}; rows.forEach(r=>{ const f=porForma[r.forma]||(porForma[r.forma]={forma:r.forma,qtd:0,total:0}); f.qtd++; f.total+=r.pago; });
  const formas=Object.values(porForma).sort((a,b)=>b.total-a.total).map(f=>({...f, pct:tot?f.total/tot:null}));
  const meses=ymLista(S.per.ini,S.per.fim); const porMes=meses.map(c=>{ const l=rows.filter(r=>r.data.slice(0,7)===c); return { c, qtd:l.length, total:soma(l,r=>r.pago), emdia:l.length?l.filter(r=>!r.atraso).length/l.length:null }; });
  const desc=soma(rows.filter(r=>r.dif<0),r=>-r.dif);
  return { titulo:'Recebimentos (entradas de caixa)', desc:'Mensalidades pagas no período, pela <b>data do pagamento</b>. Atraso = dias entre o vencimento e o pagamento.',
    kpis:[['Total recebido',BRL(tot),'var(--pos)'],['Pagamentos',NUM(rows.length)],['Ticket médio',BRL(rows.length?tot/rows.length:0)],['Pagos em dia',rows.length?PCT(emDia/rows.length):'—'],['Atraso médio (atrasados)',atr.length?Math.round(soma(atr,r=>r.atraso)/atr.length)+' dias':'—'],['Descontos concedidos',BRL(desc)]],
    blocos:[ meses.length>1?{ titulo:'Recebido por mês', html:barras(meses,[{nome:'Recebido',cor:'var(--s1)',vals:porMes.map(r=>r.total)}]) }:null,
      { titulo:'Por forma de pagamento', cols:[['forma','Forma','b'],['qtd','Pagamentos','int'],['total','Total','brl'],['pct','% do total','pct']], rows:formas, total:{qtd:rows.length,total:tot,pct:tot?1:null} },
      meses.length>1?{ titulo:'Por mês', cols:[['c','Mês','ym'],['qtd','Pagamentos','int'],['total','Recebido','brl'],['emdia','Pagos em dia','pct']], rows:porMes, total:{qtd:rows.length,total:tot,emdia:rows.length?emDia/rows.length:null} }:null,
      { titulo:'Pagamentos', cols:[['data','Pago em','date'],['loja','Loja','b'],['comp','Competência','ym'],['valor','Valor cobrado','brl'],['pago','Valor pago','brl'],['dif','Diferença','brl'],['forma','Forma','txt'],['st','Pontualidade','tag']], rows, total:{valor:soma(rows,r=>r.valor),pago:tot,dif:soma(rows,r=>r.dif)}, vazio:'Nenhum pagamento no período.' } ].filter(Boolean) }; }

function relInad(){ const hj=hojeISO(); const atr=mensAtrasadas().map(m=>({...m, dias:difDias(hj,m.vencimento)}));
  const faixa=d=>d<=15?['1–15 dias','warn']:d<=30?['16–30 dias','warn']:d<=60?['31–60 dias','neg']:d<=90?['61–90 dias','neg']:['mais de 90 dias','neg'];
  const porLoja={}; atr.forEach(m=>{ const l=porLoja[m.tenant]||(porLoja[m.tenant]={tenant:m.tenant,qtd:0,valor:0,antiga:m.vencimento,dias:0}); l.qtd++; l.valor+=+m.valor; if(m.vencimento<l.antiga) l.antiga=m.vencimento; l.dias=Math.max(l.dias,m.dias); });
  const lojas=Object.values(porLoja).sort((a,b)=>b.valor-a.valor).map(l=>{ const e=S.empresas.find(x=>x.tenant===l.tenant)||{}; const f=faixa(l.dias);
    return { loja:e.nome||l.tenant, contato:[e.contato,e.telefone].filter(Boolean).join(' · '), qtd:l.qtd, valor:l.valor, antiga:l.antiga, dias:l.dias, faixa:tg(f[0],f[1]), lic:hx(situacao(e).tag, sitTxt(e)[0]) }; });
  const total=soma(atr,m=>m.valor);
  const FX=['1–15 dias','16–30 dias','31–60 dias','61–90 dias','mais de 90 dias'];
  const aging=FX.map(n=>{ const l=atr.filter(m=>faixa(m.dias)[0]===n); return { faixa:n, qtd:l.length, valor:soma(l,m=>m.valor), pct:total?soma(l,m=>m.valor)/total:null }; });
  const vencidoTotal=soma(S.mens.filter(m=>m.situacao!=='cancelada' && m.vencimento<hj),m=>m.valor);
  const lim=addMeses(hj,1); const aVencer=S.mens.filter(m=>m.situacao==='aberta' && m.vencimento>=hj && m.vencimento<=lim);
  return { titulo:'Inadimplência e contas a receber', desc:'Mensalidades em aberto com vencimento já passado. A taxa compara o valor em atraso com tudo o que já venceu (pago ou não).',
    kpis:[['Total em atraso',BRL(total),total?'var(--neg)':''],['Lojas inadimplentes',NUM(lojas.length)],['Mensalidades em atraso',NUM(atr.length)],['Taxa de inadimplência',PCT(vencidoTotal?total/vencidoTotal:null)],['A vencer (30 dias)',BRL(soma(aVencer,m=>m.valor)),'var(--info)'],['Maior atraso',atr.length?Math.max(...atr.map(m=>m.dias))+' dias':'—']],
    blocos:[ { titulo:'Por loja', cols:[['loja','Loja','b'],['contato','Contato','txt'],['qtd','Em atraso','int'],['valor','Valor','brl'],['antiga','Mais antiga','date'],['dias','Dias','int'],['faixa','Faixa','tag'],['lic','Licença','html']], rows:lojas, total:{qtd:atr.length,valor:total}, vazio:'Nenhuma mensalidade em atraso.' },
      { titulo:'Por tempo de atraso (aging)', cols:[['faixa','Faixa','b'],['qtd','Mensalidades','int'],['valor','Valor','brl'],['pct','% do atraso','pct']], rows:aging, total:{qtd:atr.length,valor:total,pct:total?1:null} },
      { titulo:'Mensalidades em atraso', cols:[['loja','Loja','b'],['comp','Competência','ym'],['venc','Vencimento','date'],['dias','Dias de atraso','int'],['valor','Valor','brl']], rows:atr.sort((a,b)=>b.dias-a.dias).map(m=>({loja:nomeDe(m.tenant),comp:m.competencia,venc:m.vencimento,dias:m.dias,valor:+m.valor})), vazio:'Nenhuma mensalidade em atraso.' },
      { titulo:'A vencer nos próximos 30 dias', cols:[['loja','Loja','b'],['comp','Competência','ym'],['venc','Vencimento','date'],['valor','Valor','brl']], rows:aVencer.sort((a,b)=>a.vencimento.localeCompare(b.vencimento)).map(m=>({loja:nomeDe(m.tenant),comp:m.competencia,venc:m.vencimento,valor:+m.valor})), total:{valor:soma(aVencer,m=>m.valor)}, vazio:'Nada a vencer — gere as mensalidades do mês na aba Financeiro.' } ] }; }

function relLojas(){ const meses=ymLista(S.per.ini,S.per.fim); const L={}; let naoRat=0;
  const get=t=>L[t]||(L[t]={tenant:t,meses:0,fat:0,rec:0,aberto:0,dir:0,rat:0});
  meses.forEach(c=>{ const fm=fatDe(c), ks=custosDe(c); const ft=soma(fm,m=>m.valor), rateavel=soma(ks.filter(k=>!k.tenant),k=>k.valor);
    fm.forEach(m=>{ const l=get(m.tenant); l.meses++; l.fat+=+m.valor; if(m.situacao==='paga') l.rec+=+m.valor_pago; else l.aberto+=+m.valor; });
    ks.filter(k=>k.tenant).forEach(k=>get(k.tenant).dir+=+k.valor);
    if(ft>0){ const por={}; fm.forEach(m=>por[m.tenant]=(por[m.tenant]||0)+(+m.valor)); Object.entries(por).forEach(([t,v])=>get(t).rat+=rateavel*v/ft); } else naoRat+=rateavel; });
  const fatTot=soma(Object.values(L),l=>l.fat);
  const vh=S.gerOk?valorHora():0; const supMin={}; if(S.gerOk) atendPeriodo(perIni(),perFim()).forEach(a=>{ if(a.tenant) supMin[a.tenant]=(supMin[a.tenant]||0)+(+a.minutos||0); });
  const rows=Object.values(L).map(l=>{ const e=S.empresas.find(x=>x.tenant===l.tenant)||{}; const res=l.fat-l.dir-l.rat;
    const horas=(supMin[l.tenant]||0)/60, sup=vh?horas*vh:null, res2=sup!=null?res-sup:null;
    return { loja:e.nome||l.tenant, plano:e.plano||'', sit:tg(...sitTxt(e)), meses:l.meses, fat:l.fat, rec:l.rec, aberto:l.aberto, dir:l.dir, rat:l.rat, res, marg:l.fat?res/l.fat:null, horas:S.gerOk?horas:null, sup, res2, marg2:(res2!=null&&l.fat)?res2/l.fat:null, part:fatTot?l.fat/fatTot:null }; }).sort((a,b)=>b.res-a.res);
  if(naoRat>0) rows.push({ loja:'Custos gerais sem receita no mês (não rateados)', rat:naoRat, res:-naoRat });
  const T={}; ['meses','fat','rec','aberto','dir','rat','res','horas'].forEach(k=>T[k]=soma(rows,r=>r[k])); T.marg=T.fat?T.res/T.fat:null; T.part=fatTot?1:null;
  if(vh){ T.sup=soma(rows,r=>r.sup); T.res2=T.res-T.sup; T.marg2=T.fat?T.res2/T.fat:null; }
  const lj=rows.filter(r=>r.plano!==undefined && r.fat>0); const prej=lj.filter(r=>r.res<0);
  return { titulo:'Rentabilidade por loja', desc:'Receita faturada de cada loja no período menos os custos lançados para ela (diretos) e a parte dos custos gerais — rateados na proporção da receita de cada mês.',
    kpis:[['Lojas com receita',NUM(lj.length)],['Receita média por loja',BRL(lj.length?fatTot/lj.length:0)],['Resultado total',BRL(T.res),T.res<0?'var(--neg)':'var(--pos)'],['Mais rentável',lj[0]?esc(lj[0].loja):'—'],['Lojas com prejuízo',NUM(prej.length),prej.length?'var(--neg)':''],['Custo do seu suporte',vh?BRL(T.sup):(S.gerOk?'defina o valor da hora':'—')]],
    blocos:[ { titulo:'Participação na receita', html:hbarras(lj.slice().sort((a,b)=>b.fat-a.fat).slice(0,12).map(r=>({l:r.loja,v:r.fat,x:PCT(r.part)}))) },
      { titulo:'Resultado por loja', cols:[['loja','Loja','b'],['plano','Plano','txt'],['sit','Situação','tag'],['meses','Meses cobrados','int'],['fat','Faturado','brl'],['rec','Recebido','brl'],['aberto','Em aberto','brl'],['dir','Custos diretos','brl'],['rat','Rateio gerais','brl'],['res','Resultado','brl'],['marg','Margem','pct'],['horas','Horas de suporte','dec'],['sup','Custo do suporte','brl'],['res2','Resultado após suporte','brl'],['marg2','Margem após suporte','pct'],['part','% receita','pct']], rows, total:T, vazio:'Nenhuma mensalidade no período.' } ],
    nota:'"Após suporte" desconta as horas registradas em Suporte › Atendimentos × valor da sua hora. Esse custo não entra no Resultado mensal (é o seu tempo, não uma despesa paga).' }; }

function relSaaS(){ const meses=ymLista(S.per.ini,S.per.fim);
  const rows=meses.map(c=>{ const at=ativosEm(c), ant=ativosEm(ymAdd(c,-1)); const novos=S.empresas.filter(e=>(ativadaDe(e)||'').slice(0,7)===c), canc=S.empresas.filter(e=>(e.cancelado_em||'').slice(0,7)===c);
    const pc=ymAdd(c,-1); const mrr=soma(at,e=>valorEm(e,c)); let exp=0, contr=0;
    at.forEach(e=>{ if(novos.includes(e) || !ant.includes(e)) return; const d=valorEm(e,c)-valorEm(e,pc); if(d>0) exp+=d; else contr-=d; });
    return { c, ativos:at.length, novos:novos.length, canc:canc.length, churn:ant.length?canc.length/ant.length:null, mrr, mnovo:soma(novos,e=>valorEm(e,c)), exp, contr, mperd:soma(canc,e=>valorEm(e,pc)), arpa:at.length?mrr/at.length:null, _base:ant.length }; });
  const mrrIni=soma(ativosEm(ymAdd(S.per.ini,-1)),e=>valorEm(e,ymAdd(S.per.ini,-1)));
  const nrr=mrrIni?(mrrIni+soma(rows,r=>r.exp)-soma(rows,r=>r.contr)-soma(rows,r=>r.mperd))/mrrIni:null;
  const baseTot=soma(rows,r=>r._base), cancTot=soma(rows,r=>r.canc), churnMed=baseTot?cancTot/baseTot:null;
  const pagH=pagantesHoje(), mrr=mrrAtual(), arpa=pagH.length?mrr/pagH.length:0;
  const ltv=churnMed>0?arpa/churnMed:null; const casa=pagH.map(mesesDeCasa).filter(x=>x!=null);
  const criados=S.empresas.filter(e=>{ const d=String(e.criado_em||'').slice(0,10); return d>=perIni()&&d<=perFim(); }); const conv=criados.filter(e=>e.ativada_em||e.status!=='teste');

  const canc=S.empresas.filter(e=>e.cancelado_em && e.cancelado_em>=perIni() && e.cancelado_em<=perFim()).map(e=>({ loja:e.nome, desde:ativadaDe(e), em:e.cancelado_em, casa:mesesDeCasa(e), valor:valorEm(e,ymAdd(e.cancelado_em.slice(0,7),-1)), pago:soma(S.mens.filter(m=>m.tenant===e.tenant&&m.situacao==='paga'),m=>m.valor_pago), motivo:e.motivo_cancelamento||'' }));
  return { titulo:'Indicadores SaaS', desc:'Saúde do negócio de licenças. Um cliente conta como ativo no mês entre a data "cliente pagante desde" e o encerramento do contrato. Churn = contratos encerrados no mês ÷ clientes ativos no fim do mês anterior.',
    kpis:[['MRR hoje',BRL(mrr)],['ARR',BRL(mrr*12)],['Clientes pagantes',NUM(pagH.length)],['Ticket médio (ARPA)',BRL(arpa)],['Churn médio mensal',churnMed==null?'—':PCT(churnMed),churnMed>0.03?'var(--neg)':''],['LTV estimado',ltv==null?'—':BRL(ltv)],['Tempo médio de casa',casa.length?(soma(casa,x=>x)/casa.length).toLocaleString('pt-BR',{maximumFractionDigits:1})+' meses':'—'],['Conversão de testes',criados.length?PCT(conv.length/criados.length)+` <span class="mut small" style="font-weight:400">(${conv.length}/${criados.length})</span>`:'—'],['Testes em andamento',NUM(testesAbertos),'var(--info)'],['Retenção de receita (NRR)',nrr==null?'—':PCT(nrr),nrr!=null&&nrr<1?'var(--neg)':'var(--pos)']],
    blocos:[ { titulo:'MRR contratado por mês', html:barras(meses,[{nome:'MRR',cor:'var(--s1)',vals:rows.map(r=>r.mrr)}]) },
      { titulo:'Evolução mensal', cols:[['c','Mês','ym'],['ativos','Clientes ativos','int'],['novos','Novos','int'],['canc','Cancelados','int'],['churn','Churn','pct'],['mrr','MRR','brl'],['mnovo','MRR novo','brl'],['exp','Expansão','brl'],['contr','Contração','brl'],['mperd','MRR perdido','brl'],['arpa','Ticket médio','brl']], rows, total:{_label:'Período',novos:soma(rows,r=>r.novos),canc:cancTot,churn:churnMed,mnovo:soma(rows,r=>r.mnovo),exp:soma(rows,r=>r.exp),contr:soma(rows,r=>r.contr),mperd:soma(rows,r=>r.mperd)} },
      { titulo:'Cancelamentos no período', cols:[['loja','Loja','b'],['desde','Cliente desde','date'],['em','Encerrado em','date'],['casa','Meses de casa','dec'],['valor','Mensal','brl'],['pago','Total pago','brl'],['motivo','Motivo','txt']], rows:canc, total:{valor:soma(canc,r=>r.valor),pago:soma(canc,r=>r.pago)}, vazio:'Nenhum contrato encerrado no período.' } ],

function relCarteira(){ const todas=S.empresas, viv=todas.filter(e=>!e.cancelado_em);
  const grp=(lista,chave)=>{ const g={}; lista.forEach(e=>{ const k=chave(e)||'(não informado)'; const x=g[k]||(g[k]={k,lojas:0,mrr:0}); x.lojas++; if(e.status!=='teste'&&!situacao(e).bloq) x.mrr+=+e.valor_mensal||0; }); return Object.values(g).sort((a,b)=>b.mrr-a.mrr||b.lojas-a.lojas); };
  const mrr=mrrAtual();
  const ORD=['ativa','vencendo','carência','teste','suspensa','vencida','encerrada']; const COR={ativa:'pos',vencendo:'warn','carência':'warn',teste:'info',suspensa:'neg',vencida:'neg',encerrada:'mut'};
  const porSit=grp(todas,e=>sitTxt(e)[0]).sort((a,b)=>ORD.indexOf(a.k)-ORD.indexOf(b.k)).map(x=>({sit:tg(x.k,COR[x.k]||'mut'),lojas:x.lojas,mrr:x.mrr,pct:todas.length?x.lojas/todas.length:null}));
  const porPlano=grp(viv,e=>e.plano).map(x=>({plano:x.k,lojas:x.lojas,mrr:x.mrr,ticket:x.lojas?x.mrr/x.lojas:0,pct:mrr?x.mrr/mrr:null}));
  const porCidade=grp(viv,e=>(e.cidade||'').toUpperCase()).map(x=>({cidade:x.k,lojas:x.lojas,mrr:x.mrr,pct:mrr?x.mrr/mrr:null}));
  const lista=todas.map(e=>({ loja:e.nome, cidade:e.cidade||'', plano:e.plano, sit:tg(...sitTxt(e)), valor:+e.valor_mensal||0, desde:ativadaDe(e), casa:mesesDeCasa(e), pago:soma(S.mens.filter(m=>m.tenant===e.tenant&&m.situacao==='paga'),m=>m.valor_pago), atraso:soma(S.mens.filter(m=>m.tenant===e.tenant&&mSit(m)==='atrasada'),m=>m.valor) })).sort((a,b)=>b.pago-a.pago||b.valor-a.valor);

      { titulo:'Todas as lojas', cols:[['loja','Loja','b'],['cidade','Cidade','txt'],['plano','Plano','txt'],['sit','Situação','tag'],['valor','Mensal','brl'],['desde','Pagante desde','date'],['casa','Meses de casa','dec'],['pago','Total recebido','brl'],['atraso','Em atraso','brl']], rows:lista, total:{valor:soma(lista,l=>l.valor),pago:soma(lista,l=>l.pago),atraso:soma(lista,l=>l.atraso)}, vazio:'Nenhuma loja cadastrada.' } ] }; }

function versaoMaisNova(){ const prim={}; Object.values(S.sinais).forEach(s=>(s.historico||[]).forEach(h=>{ if(h&&h.versao&&h.em&&(!prim[h.versao]||h.em<prim[h.versao])) prim[h.versao]=h.em; }));
  Object.values(S.sinais).forEach(s=>{ if(s.versao&&!prim[s.versao]) prim[s.versao]=s.ultima_abertura||''; });
  return Object.entries(prim).sort((a,b)=>b[1].localeCompare(a[1]))[0]?.[0]||null; }
function tendenciaVendas(s){ if(!s||!s.ultima_abertura||s.vendas_mes==null) return null; const agora=new Date(); const ult=new Date(s.ultima_abertura);
  if(ym(ult)!==ymHoje()||agora.getDate()<7) return null; const antC=ymAdd(ymHoje(),-1);
  const ant=(s.historico||[]).filter(h=>h&&h.em&&ym(new Date(h.em))===antC).sort((a,b)=>a.em.localeCompare(b.em)).pop(); if(!ant||!(+ant.vendas_mes>0)) return null;
  const dm=new Date(agora.getFullYear(),agora.getMonth()+1,0).getDate(); const proj=(+s.vendas_mes)/agora.getDate()*dm; return proj/(+ant.vendas_mes)-1; }
function relSaude(){ const nova=versaoMaisNova(); const agora=Date.now();
  const rows=S.empresas.filter(e=>!e.cancelado_em).map(e=>{ const s=S.sinais[e.tenant]||{}, sit=situacao(e); let sc=100; const mot=[];
    let dAb=null; if(!s.ultima_abertura){ sc-=30; mot.push('nunca abriu o sistema'); } else { dAb=Math.floor((agora-new Date(s.ultima_abertura))/86400000); if(dAb>14){ sc-=40; mot.push('sem abrir há '+dAb+' dias'); } else if(dAb>7){ sc-=25; mot.push('sem abrir há '+dAb+' dias'); } else if(dAb>3){ sc-=10; mot.push('pouco uso ('+dAb+' dias sem abrir)'); } }
    const atr=mensAtrasadas().filter(m=>m.tenant===e.tenant); const vAtr=soma(atr,m=>m.valor);
    if(atr.length){ const md=Math.max(...atr.map(m=>-diasAte(m.vencimento))); sc-= md>30?40:md>15?30:15; mot.push(atr.length+' mensalidade(s) em atraso ('+md+'d)'); }
    if(sit.bloq){ sc-=30; mot.push('licença bloqueada'); } else if(sit.dias!=null&&sit.dias<=10){ sc-=10; mot.push(sit.dias<0?'licença em carência':'licença vence em '+sit.dias+'d'); }
    if(nova&&s.versao&&s.versao!==nova){ sc-=5; mot.push('versão desatualizada'); }
    let d14=null; if(S.gerOk){ const us=S.usoPor[e.tenant]||[]; const hj=hojeISO();
      if(us.length && us[0].dia<=addDias(hj,-13)){ d14=diasAtivos(e.tenant,addDias(hj,-13),hj); if(d14<4){ sc-=15; mot.push('só '+d14+' dia(s) de uso em 14'); } }
      const ab=S.atend.filter(a=>a.tenant===e.tenant&&a.situacao==='aberto'&&a.data<=addDias(hj,-3)); if(ab.length){ sc-=5; mot.push(ab.length+' atendimento(s) aberto(s) há 3+ dias'); }
      const n30=S.atend.filter(a=>a.tenant===e.tenant&&a.data>=addDias(hj,-29)).length; if(n30>=6){ sc-=5; mot.push('muitos chamados ('+n30+' em 30 dias)'); } }
    const tv=tendenciaVendas(s); if(tv!=null&&tv<-0.3){ sc-=15; mot.push('vendas projetadas '+Math.round(-tv*100)+'% abaixo do mês anterior'); }
    if(e.status==='teste'&&sit.dias!=null&&sit.dias<=7&&sit.dias>=0) mot.push('teste termina em '+sit.dias+'d — hora de converter');
    sc=Math.max(0,sc); const cls=sc>=75?['saudável','pos']:sc>=50?['atenção','warn']:['risco','neg'];
    return { loja:e.nome, sit:hx(sit.tag,sitTxt(e)[0]), score:tg(sc+' · '+cls[0],cls[1]), _sc:sc, _cls:cls[0], ab:s.ultima_abertura?(dAb===0?'hoje':'há '+dAb+'d'):'nunca', versao:s.versao||'', usu:s.usuarios, vendas:s.vendas_mes, tv, atraso:vAtr||null, mot:mot.join('; ')||'—', d14, _v:+e.valor_mensal||0 }; }).sort((a,b)=>a._sc-b._sc);
  const n=k=>rows.filter(r=>r._cls===k).length;
  return { titulo:'Saúde das lojas e risco de cancelamento', desc:'Nota de 0 a 100 por loja, a partir do uso (última abertura), pagamentos em atraso, situação da licença, versão e tendência de vendas informada pelo próprio sistema. Comece as ligações de cima para baixo.',
    kpis:[['Saudáveis (≥75)',NUM(n('saudável')),'var(--pos)'],['Atenção (50–74)',NUM(n('atenção')),'var(--amber-d)'],['Em risco (<50)',NUM(n('risco')),'var(--neg)'],['MRR em risco',BRL(soma(rows.filter(r=>r._cls==='risco'),r=>r._v)),'var(--neg)'],['Versão mais nova',nova?`<span class="mono">${esc(nova)}</span>`:'—']],
    blocos:[ { titulo:'Lojas (pior nota primeiro)', cols:[['loja','Loja','b'],['sit','Licença','html'],['score','Nota','tag'],['ab','Última abertura','txt'],['d14','Dias de uso (14d)','int'],['versao','Versão','txt'],['usu','Usuários','int'],['vendas','Vendas no mês','brl'],['tv','Projeção x mês ant.','pct'],['atraso','Em atraso','brl'],['mot','Pontos de atenção','txt']], rows, vazio:'Nenhuma loja ativa.' } ],
    nota:'Pesos: sem abrir >14d −40, >7d −25, >3d −10, nunca abriu −30; atraso >30d −40, >15d −30, até 15d −15; bloqueada −30; vencendo −10; versão antiga −5; vendas projetadas 30% abaixo −15; menos de 4 dias de uso em 14 −15; atendimento aberto há 3+ dias −5; 6+ chamados em 30 dias −5.' }; }

function relVenc(){ const hj=hojeISO(), lim=addMeses(hj,1);
  const lic=S.empresas.filter(e=>!e.cancelado_em && e.vence_em && e.vence_em<=lim).sort((a,b)=>a.vence_em.localeCompare(b.vence_em)).map(e=>({ loja:e.nome, sit:hx(situacao(e).tag,sitTxt(e)[0]), vence:e.vence_em, dias:diasAte(e.vence_em), plano:e.plano, valor:+e.valor_mensal||0, contato:[e.contato,e.telefone].filter(Boolean).join(' · ') }));
  const mens=S.mens.filter(m=>m.situacao==='aberta' && m.vencimento>=hj && m.vencimento<=lim).sort((a,b)=>a.vencimento.localeCompare(b.vencimento)).map(m=>({ loja:nomeDe(m.tenant), comp:m.competencia, venc:m.vencimento, dias:diasAte(m.vencimento), valor:+m.valor }));
  const testes=S.empresas.filter(e=>!e.cancelado_em && e.status==='teste').map(e=>({ loja:e.nome, criado:String(e.criado_em||'').slice(0,10), vence:e.vence_em, dias:e.vence_em?diasAte(e.vence_em):null, valor:+e.valor_mensal||0, abriu:(S.sinais[e.tenant]||{}).ultima_abertura?'sim':'não' }));
  return { titulo:'Agenda de vencimentos', desc:'O que vence nos próximos 30 dias: licenças (inclui as já vencidas em carência ou bloqueadas) e mensalidades em aberto.',
    kpis:[['Licenças vencendo (30d)',NUM(lic.filter(l=>l.dias>=0).length),'var(--amber-d)'],['Licenças já vencidas',NUM(lic.filter(l=>l.dias<0).length),'var(--neg)'],['Mensalidades a vencer',NUM(mens.length)],['A receber (30d)',BRL(soma(mens,m=>m.valor)),'var(--info)'],['Testes em andamento',NUM(testes.length)]],
    blocos:[ { titulo:'Licenças', cols:[['loja','Loja','b'],['sit','Situação','html'],['vence','Vence em','date'],['dias','Dias','int'],['plano','Plano','txt'],['valor','Mensal','brl'],['contato','Contato','txt']], rows:lic, vazio:'Nenhuma licença vencendo nos próximos 30 dias.' },
      { titulo:'Mensalidades a vencer', cols:[['loja','Loja','b'],['comp','Competência','ym'],['venc','Vencimento','date'],['dias','Dias','int'],['valor','Valor','brl']], rows:mens, total:{valor:soma(mens,m=>m.valor)}, vazio:'Nenhuma mensalidade em aberto a vencer — gere as do mês na aba Financeiro.' },
      { titulo:'Lojas em teste', cols:[['loja','Loja','b'],['criado','Criada em','date'],['vence','Teste até','date'],['dias','Dias restantes','int'],['valor','Valor se converter','brl'],['abriu','Já usou?','txt']], rows:testes, vazio:'Nenhuma loja em teste.' } ] }; }

function relOcorr(){ const ini=perIni(), fim=perFim(); const evs=S.eventos.filter(v=>{ const d=iso(new Date(v.em)); return d>=ini&&d<=fim; });
  const porTipo={}; evs.forEach(v=>{ const t=porTipo[v.tipo]||(porTipo[v.tipo]={tipo:TIPO_NOME[v.tipo]||v.tipo,qtd:0,_l:new Set()}); t.qtd++; if(v.tenant) t._l.add(v.tenant); });
  const tipos=Object.values(porTipo).sort((a,b)=>b.qtd-a.qtd).map(t=>({tipo:t.tipo,qtd:t.qtd,lojas:t._l.size}));
  const porLoja={}; evs.forEach(v=>{ const k=v.tenant||'—'; const l=porLoja[k]||(porLoja[k]={loja:k==='—'?'(sem loja)':nomeDe(k),total:0,inv:0,bloq:0,susp:0,ren:0,pag:0}); l.total++; if(v.tipo==='licenca_invalida') l.inv++; if(v.tipo==='licenca_bloqueada') l.bloq++; if(v.tipo==='suspensa') l.susp++; if(v.tipo==='renovada') l.ren++; if(v.tipo==='pagamento') l.pag++; });
  const lojas=Object.values(porLoja).sort((a,b)=>(b.inv+b.bloq)-(a.inv+a.bloq)||b.total-a.total);
  const prob=evs.filter(v=>/licenca_invalida|licenca_bloqueada|suspensa|contrato_encerrado|estornado/.test(v.tipo)).slice(0,300).map(v=>({ em:fDH(v.em), loja:v.tenant?nomeDe(v.tenant):'—', tipo:tg(TIPO_NOME[v.tipo]||v.tipo,'neg'), det:v.detalhe||'' }));
  const inv=porTipo.licenca_invalida?porTipo.licenca_invalida.qtd:0, blq=porTipo.licenca_bloqueada?porTipo.licenca_bloqueada.qtd:0;
  return { titulo:'Ocorrências de licença', desc:'Tudo o que a Central registrou em Eventos no período: aberturas negadas por chave errada, bloqueios aplicados, suspensões, renovações e pagamentos.',
    kpis:[['Eventos no período',NUM(evs.length)],['Licenças inválidas',NUM(inv),inv?'var(--neg)':''],['Bloqueios aplicados',NUM(blq),blq?'var(--neg)':''],['Renovações',NUM(porTipo.renovada?porTipo.renovada.qtd:0)],['Pagamentos registrados',NUM(porTipo.pagamento?porTipo.pagamento.qtd:0),'var(--pos)']],
    blocos:[ { titulo:'Por tipo', cols:[['tipo','Evento','b'],['qtd','Quantidade','int'],['lojas','Lojas','int']], rows:tipos, total:{qtd:evs.length}, vazio:'Nenhum evento no período.' },
      { titulo:'Por loja', cols:[['loja','Loja','b'],['total','Eventos','int'],['inv','Lic. inválida','int'],['bloq','Bloqueios','int'],['susp','Suspensões','int'],['ren','Renovações','int'],['pag','Pagamentos','int']], rows:lojas, vazio:'Nenhum evento no período.' },
      { titulo:'Ocorrências que pedem atenção', cols:[['em','Quando','txt'],['loja','Loja','b'],['tipo','Evento','tag'],['det','Detalhe','txt']], rows:prob, vazio:'Nenhuma ocorrência problemática no período.' } ],
    nota:'A Central carrega os 1.000 eventos mais recentes.' }; }


/* ===== menu lateral (v1.3) ===== */
const ICO = {
  empresas:'<path d="M3 9l1.5-5h15L21 9M4 9v11h16V9M3 9h18M9 20v-6h6v6"/>',
  fin:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>',
  relf:'<path d="M4 20V11M10 20V5M16 20v-8M21 20H3"/>',
  relg:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  acomp:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  sup:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13.5" width="4.5" height="7" rx="1.5"/><rect x="17" y="13.5" width="4.5" height="7" rx="1.5"/>',
  eventos:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  atualizar:'<path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/>',
  seguranca:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  sair:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  recolher:'<path d="M15 18l-6-6 6-6"/>', expandir:'<path d="M9 18l6-6-6-6"/>', seta:'<path d="M9 18l6-6-6-6"/>'
};
const svg = (k,cls) => `<svg viewBox="0 0 24 24" class="${cls||''}" aria-hidden="true">${ICO[k]}</svg>`;
function menuItens(){ return [
  { k:'empresas', l:'Empresas', subs:[['lista','Lista de lojas'],['nova','+ Nova empresa']] },
  { k:'fin', l:'Financeiro', subs:[['mens','Mensalidades'],['custos','Custos'],['fech','Fechamento do mês']] },
  { k:'sup', l:'Suporte', subs:[['atend','Atendimentos'],['novo','+ Registrar atendimento']] },
  { k:'relf', l:'Relatórios financeiros', subs:[['analitico','★ Relatório analítico'], ...RELS[0][1]] },
  { k:'relg', l:'Relatórios gerenciais', subs:RELS[1][1] },
  { k:'acomp', l:'Acompanhamento' },
  { k:'eventos', l:'Eventos' } ]; }
function grupoAtivo(){ if(S.tela==='analitico') return 'relf'; if(S.tela==='rel') return RELS[0][1].some(x=>x[0]===S.rel)?'relf':'relg'; return S.tela; }
function subAtiva(g){ if(g==='empresas') return 'lista'; if(g==='sup') return 'atend'; if(g==='fin') return S.fin.aba; if(g==='relf'&&S.tela==='analitico') return 'analitico'; if(g==='relf'||g==='relg') return S.rel; return null; }
function menuBadge(g,sub){ const n=S.finOk?mensAtrasadas().length:0;
  if((g==='fin'&&sub==='mens')||(g==='relf'&&sub==='inad')||(g==='fin'&&!sub)) return n?`<span class="bdg" title="${n} mensalidade(s) em atraso">${n}</span>`:'';
  if(g==='sup'&&(sub==='atend'||!sub)&&S.gerOk){ const a=S.atend.filter(x=>x.situacao==='aberto').length; return a?`<span class="bdg" title="${a} atendimento(s) em aberto">${a}</span>`:''; }
  if(g==='fin'&&sub==='fech'&&S.gerOk){ const hj=ymHoje(); const p=[1,2,3].map(n=>ymAdd(hj,-n)).filter(c=>!S.fech.some(f=>f.competencia===c)&&(S.mens.some(m=>m.competencia===c)||S.custos.some(k=>k.competencia===c))).length; return p?`<span class="bdg" style="background:var(--amber-d)" title="${p} mês(es) para fechar">${p}</span>`:''; }
  if(g==='relg'&&(sub==='venc'||!sub)){ const v=S.empresas.filter(e=>{ const s=situacao(e); return !s.enc && e.vence_em && s.dias!=null && s.dias<=10; }).length; return v?`<span class="bdg" style="background:var(--amber-d)" title="${v} licença(s) vencendo ou vencidas">${v}</span>`:''; }
  return ''; }
function menuLateral(){ const ga=grupoAtivo();
  const itens=menuItens().map(it=>{ const ativo=ga===it.k; const exp=it.subs ? (S.exp[it.k]!=null ? S.exp[it.k] : ativo) : false;
    const bt=`<button class="mi ${ativo?'on':''} ${exp?'exp':''}" title="${esc(it.l)}" onclick="menuGrupo('${it.k}')">${svg(it.k)}<span class="txt">${esc(it.l)}</span>${it.subs&&!exp?menuBadge(it.k,null):''}${it.subs?svg('seta','seta'):''}</button>`;
    const subs=it.subs&&exp?`<div class="subs">${it.subs.map(([k,l])=>`<button class="si ${ativo&&subAtiva(it.k)===k&&k!=='nova'?'on':''}" onclick="ir('${it.k}','${k}')">${esc(l)}${menuBadge(it.k,k)}</button>`).join('')}</div>`:'';
    return bt+subs; }).join('');
  return `<aside class="side ${S.menuAberto?'aberto':''}">
    <div class="marca"><div class="logo">GP</div><div><h1>Central GestãoPro</h1><small title="${esc(S.user.email||'')}">${esc(S.user.email||'')} · v${VERSAO}</small></div></div>
    <nav aria-label="Menu principal">${itens}</nav>
    <div class="rodape">
      <button class="mi" title="Atualizar dados" onclick="carregar().then(render)">${svg('atualizar')}<span class="txt">Atualizar dados</span></button>
      <button class="mi" title="Segurança da conta" onclick="modalSeguranca()">${svg('seguranca')}<span class="txt">Segurança</span></button>
      <button class="mi btn-recolher" title="${S.mini?'Expandir menu':'Recolher menu'}" onclick="menuMini()">${svg(S.mini?'expandir':'recolher')}<span class="txt">Recolher menu</span></button>
      <button class="mi" title="Sair" onclick="sair()">${svg('sair')}<span class="txt">Sair</span></button>
    </div></aside>`; }
function menuGrupo(g){ const it=menuItens().find(x=>x.k===g); if(!it) return;
  if(!it.subs) return ir(g);
  const ativo=grupoAtivo()===g;
  if(S.mini) return ir(g, ativo?subAtiva(g):null);
  const exp=S.exp[g]!=null?S.exp[g]:ativo;
  if(!ativo){ S.exp[g]=true; return ir(g); }
  S.exp[g]=!exp; render(); }
function ir(g,sub){
  if(g==='empresas'){ S.tela='empresas'; if(sub==='nova'){ S.menuAberto=false; render(); formEmpresa(); return; } }
  else if(g==='fin'){ S.tela='fin'; if(sub) S.fin.aba=sub; }
  else if(g==='sup'){ S.tela='sup'; if(sub==='novo'){ S.menuAberto=false; render(); atendModal(null); return; } }
  else if(g==='relf' && sub==='analitico'){ S.menuAberto=false; if(S.ana){ S.tela='analitico'; } else { render(); analiticoModal(); return; } }
  else if(g==='relf'||g==='relg'){ const lista=(g==='relf'?RELS[0]:RELS[1])[1]; S.tela='rel'; S.rel = sub || (lista.some(x=>x[0]===S.rel)?S.rel:lista[0][0]); }
  else S.tela=g;
  S.menuAberto=false; render(); try{ window.scrollTo(0,0); }catch(e){} }
function menuMini(){ S.mini=!S.mini; try{ localStorage.setItem('central_menu_mini',S.mini?'1':'0'); }catch(e){} render(); }
function migalha(){ const g=grupoAtivo(); const it=menuItens().find(x=>x.k===g)||{l:''}; const s=subAtiva(g);
  const sn=it.subs&&s?(it.subs.find(x=>x[0]===s)||[])[1]:null; return sn?`${esc(it.l)} › <b>${esc(sn)}</b>`:`<b>${esc(it.l)}</b>`; }
/* ===== início ===== */
async function iniciar(){ const c=cfg(); if(!(c.url&&c.key)) return telaConfig(); if(!window.supabase){ $('app').innerHTML='<div class="gate"><div class="box">A biblioteca do Supabase não carregou (sem internet?).</div></div>'; return; }
  const client=sb(); try{ const { data }=await client.auth.getSession(); S.user=data&&data.session&&data.session.user||null; }catch(e){ S.user=null; }
  vigiarInatividade();
  client.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT' && S.aal2){ S.user=null; S.aal2=false; telaLogin('Sua sessão terminou. Entre de novo.'); } });
  if(!S.user) return telaLogin(); return passoMFA(); }
iniciar();
</script>
