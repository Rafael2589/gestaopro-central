<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Central GestãoPro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--navy:#0f172a;--navy2:#1e293b;--amber:#f59e0b;--amber-d:#b45309;--amber-soft:#fef3c7;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--pos:#16a34a;--neg:#dc2626;--info:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--amber);display:grid;place-items:center;font-weight:900;color:#0f172a;flex:none}
/* menu lateral (v1.3) */
.shell{display:flex;min-height:100vh}
.side{width:250px;flex:none;background:var(--navy);color:#cbd5e1;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:14px 10px;transition:width .15s}
.side .marca{display:flex;gap:10px;align-items:center;padding:2px 6px 14px;border-bottom:1px solid #1e293b;margin-bottom:8px;min-width:0}
.side .marca h1{font-size:15px;margin:0;color:#fff;white-space:nowrap}.side .marca small{color:#94a3b8;font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.mi,.si{display:flex;align-items:center;width:100%;background:none;border:0;cursor:pointer;font-family:inherit;text-align:left;border-radius:8px}
.mi{gap:10px;color:#cbd5e1;padding:9px 10px;font-size:13.5px;font-weight:600;margin:1px 0}
.mi svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mi:hover{background:#1e293b;color:#fff}.mi.on{background:#1e293b;color:#fff}.mi.on>svg:first-child{color:var(--amber)}
.mi .seta{margin-left:auto;width:14px;height:14px;transition:transform .15s;opacity:.7}.mi.exp .seta{transform:rotate(90deg)}
.mi .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subs{margin:0 0 6px 19px;border-left:1px solid #334155;padding-left:8px}
.si{color:#94a3b8;padding:6px 10px;font-size:13px;font-weight:500;margin:1px 0}.si:hover{color:#fff;background:#1e293b}.si.on{color:#0f172a;background:var(--amber);font-weight:700}
.bdg{margin-left:auto;background:var(--neg);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 7px;font-weight:700;line-height:16px}
.si.on .bdg{background:#0f172a}
.side .rodape{margin-top:auto;border-top:1px solid #1e293b;padding-top:8px}
.conteudo{flex:1;min-width:0}
.topo{display:flex;align-items:center;gap:10px;padding:14px 22px 0;max-width:1280px;margin:0 auto}
.crumb{font-size:13px;color:var(--mut)}.crumb b{color:var(--ink)}
.hamb{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;line-height:1}
.veu{display:none}

.shell.menu-mini .side{width:62px}.shell.menu-mini .side .txt,.shell.menu-mini .subs,.shell.menu-mini .seta,.shell.menu-mini .marca>div,.shell.menu-mini .mi .bdg{display:none}.shell.menu-mini .mi{justify-content:center;padding:10px 0}.shell.menu-mini .marca{justify-content:center;padding-left:0;padding-right:0}
@media(max-width:900px){.side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-105%);transition:transform .2s}.side.aberto{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.35)}.veu.aberto{display:block;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:55}.hamb{display:inline-block}.shell.menu-mini .side{width:250px}.shell.menu-mini .side .txt,.shell.menu-mini .subs,.shell.menu-mini .seta,.shell.menu-mini .marca>div{display:revert}.btn-recolher{display:none!important}main{padding:14px 14px}.topo{padding:12px 14px 0}}
main{padding:18px 22px;max-width:1280px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi small{color:var(--mut);font-size:11px;display:block}.kpi b{font-size:clamp(16px,1.35vw,20px);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:8px 8px;border-bottom:2px solid var(--line)}td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}tr:hover td{background:#f8fafc}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}.tag.pos{background:#dcfce7;color:#166534}.tag.neg{background:#fee2e2;color:#991b1b}.tag.warn{background:var(--amber-soft);color:#92400e}.tag.info{background:#dbeafe;color:#1e40af}.tag.mut{background:#e2e8f0;color:#475569}
.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink)}.btn.amber{background:var(--amber);border-color:var(--amber)}.btn.sm{padding:5px 9px;font-size:12px}.btn.neg{color:var(--neg)}.btn.pos{color:var(--pos)}.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar input{flex:1;min-width:200px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}label{font-size:11.5px;color:var(--mut);font-weight:600;display:block;margin:8px 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.row{grid-template-columns:1fr}}
.mut{color:var(--mut)}.small{font-size:12px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
#modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}#modal-bg.open{display:flex}.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px}.modal h3{margin:0 0 10px}
pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;font-size:12px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.gate{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f172a,#0e7490)}.gate .box{background:#fff;border-radius:16px;padding:26px;width:min(420px,92vw)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:99}#toast.err{background:var(--neg)}
.spark{display:inline-block;vertical-align:middle}
.steps li{margin:6px 0;line-height:1.5}
/* v1.2 — financeiro e relatórios */
:root{--s1:#2a78d6;--s2:#eb6834}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.subnav button{border:1px solid var(--line);background:#fff;padding:6px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink)}.subnav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.subnav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;align-self:center;margin:0 2px 0 6px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}.mini div{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px 12px}.mini small{display:block;color:var(--mut);font-size:11px}.mini b{font-size:17px;font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;background:#f8fafc;border-top:2px solid var(--line)}
.per{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.per input,.per select{width:auto;padding:6px 8px;flex:none;min-width:0}
.card h4{margin:0 0 8px;font-size:14px}.card .sub{color:var(--mut);font-size:12px;margin:-4px 0 10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin:2px 0 6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart svg{display:block;width:100%;max-width:880px;height:auto}.chart .bar:hover{opacity:.8}
.hbar{display:grid;grid-template-columns:minmax(90px,160px) 1fr auto;gap:8px;align-items:center;font-size:12.5px;margin:5px 0}.hbar .trk{background:#f1f5f9;border-radius:4px;height:12px}.hbar .trk span{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--s1)}
.aviso{background:var(--amber-soft);border:1px solid #fcd34d;border-radius:10px;padding:12px 14px;font-size:13px}
.printhead{display:none}
@media print{.side,.veu,.topo,.noprint,#toast{display:none!important}main{padding:0;max-width:none}.card{break-inside:avoid;border-color:#cbd5e1}.printhead{display:block;margin-bottom:10px}body{background:#fff}tr:hover td{background:none}}
/* v1.5 */
.strip{display:inline-flex;gap:1px;vertical-align:middle}.strip i{display:inline-block;width:6px;height:14px;border-radius:2px;background:#e2e8f0}.strip i.on{background:var(--pos)}
@media print{body:has(#modal-bg.open) #app{display:none}#modal-bg.open{position:static;background:none;padding:0}#modal-bg.open .modal{max-height:none;box-shadow:none}#modal-bg.open .btn{display:none}}
/* v1.6 — relatório analítico */
.bi-banner{display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:16px;cursor:pointer;margin-bottom:16px;background:linear-gradient(120deg,#0f1f3a,#1e3a5f);color:#fff;box-shadow:0 4px 14px rgba(15,23,42,.12);transition:.16s;border:1px solid rgba(255,255,255,.06)}
.bi-banner:hover,.bi-banner:focus-visible{transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,31,58,.28);outline:none}
.bi-ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:rgba(245,158,11,.2);flex:none}
.bi-ico svg{width:26px;height:26px;fill:none;stroke:var(--amber);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bi-tx{flex:1;min-width:0}.bi-tx h3{font-size:17px;font-weight:700;margin:0;letter-spacing:-.2px}.bi-tx p{font-size:13px;opacity:.8;margin:3px 0 0}
.bi-go{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);padding:9px 15px;border-radius:9px;white-space:nowrap}
.bi-go svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:640px){.bi-banner{flex-wrap:wrap}.bi-go{margin-left:auto}}
.an-capa{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,#0f1f3a,#1e3a5f);color:#fff;border-radius:16px;padding:20px 22px;margin-bottom:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.an-capa small{color:#94a3b8;font-size:12px}.an-capa h2{margin:2px 0 4px;font-size:22px}.an-capa p{margin:0;color:#cbd5e1;font-size:13px}
.an-tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.an-tiles>div{background:#fff}.an-tiles>div>div{background:none;border:0;padding:0;margin-top:2px}
.an-ins{display:grid;gap:8px}.an-i{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;border:1px solid var(--line);border-left-width:4px;font-size:13.5px;line-height:1.5;break-inside:avoid}
.an-ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;margin-top:1px}
.an-i.alerta{border-left-color:var(--neg);background:#fef2f2}.an-i.alerta .an-ic{background:var(--neg)}
.an-i.atencao{border-left-color:var(--amber);background:#fffbeb}.an-i.atencao .an-ic{background:var(--amber-d)}
.an-i.bom{border-left-color:var(--pos);background:#f0fdf4}.an-i.bom .an-ic{background:var(--pos)}
.an-i.info{border-left-color:#94a3b8;background:#f8fafc}.an-i.info .an-ic{background:#64748b}
.an-acoes{margin:0;padding-left:22px}.an-acoes li{margin:5px 0;line-height:1.5}.an-acoes li.alerta::marker{color:var(--neg);font-weight:800}.an-acoes li.atencao::marker{color:var(--amber-d);font-weight:800}
@media print{.an-i,.an-tiles>div{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(min-width:1600px){.kpis{grid-template-columns:repeat(8,minmax(0,1fr))}}@media(max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<script>
/* ===== Conexão do projeto Supabase DA CENTRAL (cole aqui depois de criar o projeto) ===== */
// Conexão FIXA com o projeto Supabase da Central (Settings → API Keys). Só a URL e a chave PUBLICÁVEL —
// nunca a service_role/secret. Com isto preenchido, nenhum computador pede a conexão: vai direto para o login.
const CENTRAL_CFG = { url: 'https://hpwvrutngzpiimaypijs.supabase.co', key: 'sb_publishable_01v-fzmCQZcobWFgx0zQwA_caQjRi1W' };   // ex.: url:'https://xxxx.supabase.co', key:'sb_publishable_...'
const VERSAO = '1.6';  // repositório próprio: TROPICAL\\CENTRAL GESTAO (nunca dentro do repositório do sistema da loja)
const CENTRAL_URL_ATUAL = () => (cfg().url || '').replace(/\/+$/,'');

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = v => (+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fD = d => { if(!d) return '—'; const x=new Date(String(d).length===10?d+'T00:00:00':d); return isNaN(x)?'—':x.toLocaleDateString('pt-BR'); };
const fDH = d => { if(!d) return '—'; const x=new Date(d); return isNaN(x)?'—':x.toLocaleString('pt-BR'); };
const hoje = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const pad2 = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());   // data LOCAL (sem fuso)
const hojeISO = () => iso(new Date());
const ym = d => (typeof d==='string') ? d.slice(0,7) : d.getFullYear()+'-'+pad2(d.getMonth()+1);
const ymHoje = () => ym(new Date());
const ymAdd = (c,n) => { const [a,m]=c.split('-').map(Number); return ym(new Date(a,m-1+n,1)); };
const ymLista = (ini,fim) => { const r=[]; let c=ini; while(c<=fim && r.length<120){ r.push(c); c=ymAdd(c,1); } return r; };
const ymNome = c => { if(!c) return '—'; const [a,m]=c.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m-1]+'/'+a.slice(2); };
const ymFimISO = c => { const [a,m]=c.split('-').map(Number); return iso(new Date(a,m,0)); };
const vencDe = (c,dia) => { const [a,m]=c.split('-').map(Number); const u=new Date(a,m,0).getDate(); return iso(new Date(a,m-1,Math.min(Math.max(+dia||10,1),u))); };
const addMeses = (isoD,n) => { const [a,m,d]=isoD.split('-').map(Number); const u=new Date(a,m-1+n+1,0).getDate(); return iso(new Date(a,m-1+n,Math.min(d,u))); };
const difDias = (a,b) => Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000);
const PCT = v => (v==null||!isFinite(v)) ? '—' : (v*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const NUM = v => (+v||0).toLocaleString('pt-BR');
const BRLc = v => { const a=Math.abs(+v||0), s=(+v<0?'-':''); return a>=1e6? s+'R$ '+(a/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi' : a>=1e3? s+'R$ '+(a/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil' : s+'R$ '+a.toLocaleString('pt-BR',{maximumFractionDigits:0}); };
const soma = (arr,f) => arr.reduce((t,x)=>t+(+f(x)||0),0);
const nomeDe = t => t ? ((S.empresas.find(e=>e.tenant===t)||{}).nome || t) : 'Geral (rateado)';
const diasAte = d => d ? Math.round((new Date(d+'T00:00:00')-hoje())/86400000) : null;
function toast(m,k){ const t=$('toast'); t.textContent=m; t.className=k==='err'?'err':''; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',3500); }
function abrirModal(html){ $('modal').innerHTML=html; $('modal-bg').classList.add('open'); }
function fecharModal(){ $('modal-bg').classList.remove('open'); }
function gerarChave(){ const a=new Uint8Array(24); crypto.getRandomValues(a); return 'gp_'+Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function copiar(txt){ try{ navigator.clipboard.writeText(txt); toast('Copiado'); }catch(e){ toast('Selecione e copie manualmente','err'); } }

/* ===== estado ===== */
const S = { tela:'empresas', empresas:[], sinais:{}, eventos:[], q:'', user:null, aal2:false,
  mens:[], custos:[], finOk:true, finErr:'', fin:{ comp:null, aba:'mens' }, rel:'dre', per:{ ini:null, fim:null }, prevN:6, exp:{}, menuAberto:false, mini:(()=>{ try{ return localStorage.getItem('central_menu_mini')==='1'; }catch(e){ return false; } })() };

/* ===== acesso (v1.4): conexão fixa + login + autenticador (TOTP) ===== */
const CFG_FIXA = () => !!(CENTRAL_CFG.url && CENTRAL_CFG.key);
function cfg(){ if(CFG_FIXA()) return CENTRAL_CFG; try{ const l=JSON.parse(localStorage.getItem('central_cfg')||'null'); if(l&&l.url&&l.key) return l; }catch(e){} return CENTRAL_CFG; }
// "Manter conectado neste computador": sessão no localStorage; senão no sessionStorage (fecha o navegador = sai)
const LEMBRAR_KEY='central_lembrar';
const lembrar = () => { try{ return localStorage.getItem(LEMBRAR_KEY)==='1'; }catch(e){ return false; } };
const AUTH_STORAGE = {
  getItem(k){ try{ return (lembrar()?localStorage:sessionStorage).getItem(k); }catch(e){ return null; } },
  setItem(k,v){ try{ (lembrar()?localStorage:sessionStorage).setItem(k,v); }catch(e){} },
  removeItem(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch(e){} }
};
let SB=null; function sb(){ if(SB) return SB; const c=cfg(); if(!(c.url&&c.key)||!window.supabase) return null;
  SB=window.supabase.createClient(String(c.url).trim().replace(/\/(rest|auth)\/v1\/?$/,'').replace(/\/+$/,''),c.key,{ auth:{ storage:AUTH_STORAGE, storageKey:'central-gp-auth', persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } }); return SB; }

const INATIVO_MIN = 60;   // sai sozinho depois de 60 min sem mexer
let _ultAtiv=Date.now(), _timerInat=null;
function vigiarInatividade(){ ['click','keydown','mousemove','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{ _ultAtiv=Date.now(); },{ passive:true }));
  clearInterval(_timerInat); _timerInat=setInterval(()=>{ if(S.user && S.aal2 && Date.now()-_ultAtiv > INATIVO_MIN*60000){ sair('Sessão encerrada por inatividade. Entre de novo.'); } },60000); }

const caixa = inner => `<div class="gate"><div class="box">
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><div class="logo">GP</div><div><h2 style="margin:0;font-size:18px">Central GestãoPro</h2><span class="mut small">acesso do dono do sistema</span></div></div>${inner}</div></div>`;
function telaConfig(){ $('app').innerHTML=caixa(`<p class="mut small">Conexão com o projeto Supabase <b>da Central</b> (Settings → API Keys). Para não pedir isto em outro computador, preencha <span class="mono">CENTRAL_CFG</span> no topo do arquivo.</p>
  <label>Project URL</label><input id="c-url" placeholder="https://xxxx.supabase.co"><label>Chave publicável (sb_publishable_…)</label><input id="c-key">
  <button class="btn amber" style="width:100%;margin-top:14px" onclick="salvarCfg()">Salvar e continuar</button>`); }
function salvarCfg(){ const url=$('c-url').value.trim().replace(/\/+$/,''), key=$('c-key').value.trim(); if(!/^https:\/\//.test(url)||!key){ toast('Informe a URL e a chave','err'); return; } try{ localStorage.setItem('central_cfg',JSON.stringify({url,key})); }catch(e){} SB=null; iniciar(); }

function telaLogin(msg){ S.user=null; S.aal2=false;
  $('app').innerHTML=caixa(`<p class="small" style="margin:0 0 4px;color:var(--mut)">Passo 1 de 2 · e-mail e senha</p>
  <label>E-mail</label><input id="l-email" type="email" autocomplete="username" autofocus>

async function entrar(){ const c=sb(); if(!c) return telaConfig(); const email=$('l-email').value.trim(), senha=$('l-senha').value;
  if(!email||!senha){ $('l-err').textContent='Informe e-mail e senha.'; return; }
  try{ localStorage.setItem(LEMBRAR_KEY, $('l-lembrar').checked?'1':'0'); }catch(e){}
  $('l-err').textContent='Entrando…'; $('l-btn').disabled=true;
  const { data, error }=await c.auth.signInWithPassword({ email, password:senha });
  if(error){ $('l-btn').disabled=false; $('l-err').textContent=/invalid/i.test(error.message)?'E-mail ou senha incorretos.':/rate|many/i.test(error.message)?'Muitas tentativas. Aguarde alguns minutos.':error.message; return; }
  S.user=data.user; await passoMFA(); }

async function passoMFA(){ const c=sb();
  const { data:aal, error }=await c.auth.mfa.getAuthenticatorAssuranceLevel();
  if(error) return telaLogin('Não foi possível conferir o autenticador: '+error.message);
  if(aal.currentLevel==='aal2'){ S.aal2=true; _ultAtiv=Date.now(); await carregar(); return render(); }
  const { data:f, error:e2 }=await c.auth.mfa.listFactors();
  if(e2) return telaLogin(e2.message);
  const ok=(f.totp||[]).filter(x=>x.status==='verified');
  return ok.length ? telaCodigo(ok) : telaCadastroAutenticador(f); }

function telaCodigo(fatores, msg){ S.aal2=false;

  ${fatores.length>1?`<label>Aparelho</label><select id="m-fator">${fatores.map(x=>`<option value="${esc(x.id)}">${esc(x.friendly_name||'Autenticador')}</option>`).join('')}</select>`:`<input type="hidden" id="m-fator" value="${esc(fatores[0].id)}">`}
  <label>Código</label><input id="m-cod" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="font-size:24px;letter-spacing:8px;text-align:center" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,6);if(this.value.length===6)confirmarCodigo()" onkeydown="if(event.key==='Enter')confirmarCodigo()">

  setTimeout(()=>{ const e=$('m-cod'); if(e) e.focus(); },50); }

let _verificando=false;
async function confirmarCodigo(){ if(_verificando) return; const code=$('m-cod').value.trim(), factorId=$('m-fator').value;
  if(!/^\d{6}$/.test(code)){ $('m-err').textContent='Digite os 6 dígitos.'; return; }
  _verificando=true; $('m-btn').disabled=true; $('m-err').textContent='Conferindo…';
  const { error }=await sb().auth.mfa.challengeAndVerify({ factorId, code });
  _verificando=false;
  if(error){ $('m-btn').disabled=false; $('m-cod').value=''; $('m-cod').focus(); $('m-err').textContent=/invalid|expired|code/i.test(error.message)?'Código inválido ou expirado. Espere o próximo código e tente de novo.':error.message; return; }
  S.aal2=true; _ultAtiv=Date.now(); await carregar(); render(); }

async function iniciarCadastro(){ const c=sb();
  const { data:f }=await c.auth.mfa.listFactors();
  for(const x of ((f&&f.all)||[]).filter(x=>x.status==='unverified')){ try{ await c.auth.mfa.unenroll({ factorId:x.id }); }catch(e){} }
  const nome='Celular '+new Date().toLocaleString('pt-BR').replace(/[/:, ]+/g,'-');
  return c.auth.mfa.enroll({ factorType:'totp', friendlyName:nome, issuer:'Central GestãoPro' }); }
function qrSrc(q){ q=String(q||''); const pre='data:image/svg+xml;utf-8,';   // o Supabase pode devolver o SVG puro ou já como data URL
  if(q.startsWith(pre)) q=q.slice(pre.length); else if(q.startsWith('data:')) return q;
  return pre+encodeURIComponent(q); }

    <img src="${esc(qrSrc(d.totp.qr_code))}" alt="QR code do autenticador" style="width:180px;height:180px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px">
    <div class="small" style="flex:1;min-width:180px"><b>Não consegue ler o QR?</b> No Google Authenticator toque em <b>+</b> › <b>Inserir chave de configuração</b>, nome "Central GestãoPro", tipo <b>Baseada no tempo</b>, e digite a chave:<div class="mono" style="word-break:break-all;background:#f1f5f9;padding:6px 8px;border-radius:6px;margin-top:4px;user-select:all">${esc(d.totp.secret)}</div></div></div>`; }

  <div id="m-err" style="color:var(--neg);font-size:12.5px;min-height:18px;margin-top:6px"></div>

/* ===== dados ===== */
async function carregar(){ const c=sb(); if(!c) return;
  const [e,s,v,m,k]=await Promise.all([ c.from('empresas').select('*').order('criado_em'), c.from('sinais').select('*'), c.from('eventos').select('*').order('em',{ascending:false}).limit(1000),
    buscarTudo(()=>c.from('mensalidades').select('*').order('vencimento').order('id')), buscarTudo(()=>c.from('custos').select('*').order('data').order('id')), carregarGerencial(c) ]);
  if(e.error){ toast(e.error.message.indexOf('does not exist')>=0?'Rode o central.sql no projeto da Central':e.error.message,'err'); }
  S.empresas=e.data||[]; S.sinais={}; (s.data||[]).forEach(x=>S.sinais[x.tenant]=x); S.eventos=v.data||[];
  S.finOk=!(m.error||k.error); S.finErr=((m.error||k.error)||{}).message||''; S.mens=m.data||[]; S.custos=k.data||[]; }
function situacao(e){ const dias=diasAte(e.vence_em);
  if(e.cancelado_em) return {tag:'<span class="tag mut">encerrada</span>', bloq:true, enc:true, dias};
  if(e.status==='suspensa') return {tag:'<span class="tag neg">suspensa</span>', bloq:true, dias};
  if(dias!=null && dias< -7) return {tag:'<span class="tag neg">vencida</span>', bloq:true, dias};
  if(dias!=null && dias<0) return {tag:'<span class="tag warn">carência ('+(7+dias)+'d)</span>', bloq:false, dias};
  if(dias!=null && dias<=10) return {tag:'<span class="tag warn">vence em '+dias+'d</span>', bloq:false, dias};
  if(e.status==='teste') return {tag:'<span class="tag info">teste</span>', bloq:false, dias};
  return {tag:'<span class="tag pos">ativa</span>', bloq:false, dias}; }
function spark(hist){ const h=(hist||[]).slice(-14).map(x=>+x.vendas_mes||0); if(h.length<2) return ''; const max=Math.max(...h,1); const w=90,hh=22; const pts=h.map((v,i)=>[(i/(h.length-1))*w, hh-(v/max)*hh]);
  return `<svg class="spark" width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}"><polyline fill="none" stroke="#2563eb" stroke-width="1.5" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}"/></svg>`; }

  const mrr=mrrAtual();   // só lojas pagantes (fora teste, não bloqueadas)
  const semSinal=vivas.filter(e=>{ const s=S.sinais[e.tenant]; return !s || !s.ultima_abertura || (Date.now()-new Date(s.ultima_abertura))>7*86400000; }).length;
  const atraso=S.finOk? soma(mensAtrasadas(),m=>m.valor) : null;

    <div id="tela">${({empresas:telaEmpresas, fin:telaFinanceiro, rel:telaRelatorios, analitico:telaAnalitico, sup:telaSuporte, acomp:telaAcomp, eventos:telaEventos})[S.tela]()}</div>
   </main></div></div>`; }

async function salvarEmpresa(tenantAtual){ const g=id=>($(id)?$(id).value:'').trim(); const nome=g('f-nome'), tenant=(tenantAtual||g('f-tenant'));
  if(!nome){ toast('Informe o nome','err'); return; } if(!/^[a-z0-9][a-z0-9-]{2,29}$/.test(tenant)){ toast('Identificador: 3 a 30 caracteres, letras minúsculas, números e hífen','err'); return; }
  const row={ tenant, nome, cnpj:g('f-cnpj')||null, cidade:g('f-cidade')||null, contato:g('f-contato')||null, telefone:g('f-tel')||null, email:g('f-email')||null, plano:g('f-plano')||'padrao', valor_mensal:+g('f-valor')||0, vence_em:g('f-vence')||null, projeto_url:g('f-proj')||null, app_url:g('f-app')||null, chave:g('f-chave'), obs:g('f-obs')||null, atualizado_em:new Date().toISOString() };
  const dia=parseInt(g('f-dia'),10); if(dia>=1&&dia<=31) row.dia_cobranca=dia;
  row.ativada_em=g('f-ativada')||null;
  if(!tenantAtual){ row.status = row.plano==='teste'?'teste':'ativa'; if(row.status==='ativa' && !row.ativada_em) row.ativada_em=hojeISO(); }
  if(!S.finOk){ delete row.dia_cobranca; delete row.ativada_em; }   // central.sql antigo: não manda colunas novas
  const ant=tenantAtual?S.empresas.find(x=>x.tenant===tenantAtual):null;
  const mudou=ant && (Math.abs((+ant.valor_mensal||0)-row.valor_mensal)>0.004 || ant.plano!==row.plano);
  const mud=mudou&&$('f-mud-data')?{ data:$('f-mud-data').value||hojeISO(), tipo:$('f-mud-tipo').value, obs:$('f-mud-obs').value.trim() }:null;
  const c=sb(); const r=tenantAtual? await c.from('empresas').update(row).eq('tenant',tenant) : await c.from('empresas').insert(row);
  if(r.error){ toast(/duplicate|23505/i.test(r.error.message||r.error.code||'')?'Já existe uma loja com esse identificador':r.error.message,'err'); return; }
  if(mud) await histRegistrar({ tenant, vigente_desde:mud.data, plano:row.plano, valor_mensal:row.valor_mensal, tipo:mud.tipo, obs:mud.obs||('antes: '+(ant.plano||'')+' · '+BRL(ant.valor_mensal)) });
  if(!tenantAtual) await histRegistrar({ tenant, vigente_desde:row.ativada_em||hojeISO(), plano:row.plano, valor_mensal:row.valor_mensal, tipo:'inicio', obs:row.plano==='teste'?'início do teste':null });
  try{ await c.from('eventos').insert({ tenant, tipo:tenantAtual?'empresa_editada':'empresa_criada', detalhe:nome }); }catch(e){}
  fecharModal(); toast(tenantAtual?'Salvo':'Loja criada — veja o Kit de implantação'); await carregar(); render(); if(!tenantAtual) kit(tenant); }

async function encerrarContrato(tenant){ const e=S.empresas.find(x=>x.tenant===tenant); if(!e) return;

  const c=sb(); const hj=hojeISO();

async function desfazerEncerramento(tenant){ const e=S.empresas.find(x=>x.tenant===tenant); if(!e||!confirm('Desfazer o encerramento de "'+e.nome+'" e reativar a loja?')) return;

/* ===== CNPJ: consulta automática (mesma cadeia do GestãoPro: BrasilAPI → cnpj.ws → proxies) ===== */
const cnpjFmt = d => d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
function cnpjNormWS(j){ const e=(j&&j.estabelecimento)||{}; return { razao_social:j.razao_social, nome_fantasia:e.nome_fantasia, municipio:(e.cidade&&e.cidade.nome)||'', uf:(e.estado&&e.estado.sigla)||'', ddd_telefone_1:(e.ddd1&&e.telefone1)?(e.ddd1+' '+e.telefone1):'', email:e.email, qsa:(j.socios||[]).map(x=>({nome_socio:x.nome})) }; }
async function cnpjFetch(cnpj){ const tenta=async(url,norm)=>{ try{ const r=await fetch(url); if(!r.ok) return null; const j=await r.json(); return norm?norm(j):j; }catch(e){ return null; } };
  let d=await tenta('https://brasilapi.com.br/api/cnpj/v1/'+cnpj); if(d&&d.razao_social) return d;
  d=await tenta('https://publica.cnpj.ws/cnpj/'+cnpj, cnpjNormWS); if(d&&d.razao_social) return d;
  d=await tenta('https://api.allorigins.win/raw?url='+encodeURIComponent('https://brasilapi.com.br/api/cnpj/v1/'+cnpj)); if(d&&d.razao_social) return d;
  d=await tenta('https://api.allorigins.win/raw?url='+encodeURIComponent('https://receitaws.com.br/v1/cnpj/'+cnpj), j=>({ razao_social:j.nome, nome_fantasia:j.fantasia, municipio:j.municipio, uf:j.uf, ddd_telefone_1:j.telefone, email:j.email, qsa:(j.qsa||[]).map(x=>({nome_socio:x.nome})) }));
  return (d&&d.razao_social)?d:null; }
let _cnpjUlt='';
async function cnpjAoDigitar(inp, forcar){ const dig=String(inp.value||'').replace(/\D/g,'').slice(0,14); const st=$('f-cnpj-st');
  if(dig.length!==14){ if(st) st.textContent=dig.length?('('+dig.length+'/14)'):''; return; }
  inp.value=cnpjFmt(dig); if(dig===_cnpjUlt && !forcar) return; _cnpjUlt=dig;
  if(st) st.textContent='consultando…';
  const d=await cnpjFetch(dig);
  if(!d){ if(st) st.textContent='não encontrado — preencha à mão'; return; }
  const setIfEmpty=(id,v)=>{ const el=$(id); if(el && !el.value.trim() && v) el.value=v; };
  setIfEmpty('f-nome', (d.nome_fantasia||d.razao_social||'').trim());
  setIfEmpty('f-cidade', d.municipio?(d.municipio+(d.uf?'/'+d.uf:'')):'');
  setIfEmpty('f-tel', (d.ddd_telefone_1||'').trim()); setIfEmpty('f-email', (d.email||'').toLowerCase());
  setIfEmpty('f-contato', ((d.qsa&&d.qsa[0]&&(d.qsa[0].nome_socio||d.qsa[0].nome))||'').trim());
  const t=$('f-tenant'); if(t && !t.disabled && !t.value.trim()){ t.value=(d.nome_fantasia||d.razao_social||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b(ltda|me|eireli|epp|s\/?a)\b/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,30); }
  if(st) st.textContent='✓ '+(d.razao_social||'').slice(0,40); toast('Dados do CNPJ preenchidos'); }

function mrrAtual(){ return soma(S.empresas.filter(e=>!situacao(e).bloq && e.status!=='teste'), e=>e.valor_mensal); }
function mSit(m){ if(m.situacao==='paga') return 'paga'; if(m.situacao==='cancelada') return 'cancelada'; return m.vencimento < hojeISO() ? 'atrasada' : 'aberta'; }
const M_TAG = { paga:'pos', cancelada:'mut', atrasada:'neg', aberta:'info' };
const mTag = m => { const s=mSit(m); return `<span class="tag ${M_TAG[s]}">${s==='atrasada'?'atrasada '+(-diasAte(m.vencimento))+'d':s}</span>`; };
function mensAtrasadas(){ return S.mens.filter(m=>mSit(m)==='atrasada'); }
function avisoSql(){ return `<div class="aviso"><b>Falta atualizar o banco da Central.</b> Abra o Supabase do projeto da Central › SQL Editor, cole o <span class="mono">central.sql</span> novo (v1.2) e clique em Run. Nada que já existe é apagado.<div class="mut small" style="margin-top:6px">${esc(S.finErr)}</div></div>`; }

/* pagar (cria a mensalidade se ainda não existir) */
async function registrarPagamento(tenant, comp, pag){ const e=S.empresas.find(x=>x.tenant===tenant)||{}; const c=sb();
  const ex=S.mens.find(m=>m.tenant===tenant && m.competencia===comp);
  const dados={ situacao:'paga', pago_em:pag.pago_em, valor_pago:pag.valor_pago, forma:pag.forma||null };
  if(pag.obs!==undefined) dados.obs=pag.obs||null;
  const r= ex ? await c.from('mensalidades').update(dados).eq('id',ex.id)
              : await c.from('mensalidades').insert({ tenant, competencia:comp, valor:pag.valor_pago, vencimento:vencDe(comp,e.dia_cobranca), ...dados });
  if(r.error){ toast(r.error.message,'err'); return false; }
  try{ await c.from('eventos').insert({ tenant, tipo:'pagamento', detalhe:ymNome(comp)+' · '+BRL(pag.valor_pago)+' · '+formaNome(pag.forma) }); }catch(x){}
  return true; }

function telaFinanceiro(){ if(!S.finOk) return avisoSql();
  if(S.fin.aba==='fech') return telaFechamento();
  if(!S.fin.comp) S.fin.comp=ymHoje(); const c=S.fin.comp;
  const nav=`<div class="toolbar noprint"><h3 style="margin:0;font-size:16px">${S.fin.aba==='custos'?'Custos da operação':'Mensalidades'}</h3>
    <div class="per" style="margin-left:auto"><button class="btn sm" onclick="S.fin.comp=ymAdd(S.fin.comp,-1);render()">‹</button><input type="month" value="${c}" onchange="if(this.value){S.fin.comp=this.value;render()}"><button class="btn sm" onclick="S.fin.comp=ymAdd(S.fin.comp,1);render()">›</button>${c!==ymHoje()?`<button class="btn sm" onclick="S.fin.comp=ymHoje();render()">Mês atual</button>`:''}</div></div>`;
  return nav + (S.fin.aba==='custos' ? finCustos(c) : finMens(c)); }

function finMens(c){ const doMes=S.mens.filter(m=>m.competencia===c).sort((a,b)=>a.vencimento.localeCompare(b.vencimento)||nomeDe(a.tenant).localeCompare(nomeDe(b.tenant)));
  const validas=doMes.filter(m=>m.situacao!=='cancelada');
  const prev=soma(validas,m=>m.valor), rec=soma(validas.filter(m=>m.situacao==='paga'),m=>m.valor_pago), ab=soma(validas.filter(m=>mSit(m)==='aberta'),m=>m.valor), at=soma(validas.filter(m=>mSit(m)==='atrasada'),m=>m.valor);
  const antigas=mensAtrasadas().filter(m=>m.competencia<c);
  const linha=m=>`<tr><td><b>${esc(nomeDe(m.tenant))}</b>${m.obs?`<div class="mut small">${esc(m.obs)}</div>`:''}</td><td>${ymNome(m.competencia)}</td><td class="n">${BRL(m.valor)}</td><td>${fD(m.vencimento)}</td><td>${mTag(m)}</td><td>${m.pago_em?fD(m.pago_em):'—'}</td><td class="n">${m.valor_pago!=null?BRL(m.valor_pago):'—'}</td><td>${m.forma?formaNome(m.forma):'—'}</td>
    <td style="white-space:nowrap" class="noprint">${m.situacao==='paga'?`<button class="btn sm" onclick="estornar(${m.id})">Estornar</button>`:m.situacao==='aberta'?`<button class="btn sm pos" onclick="receberModal(${m.id})">Receber</button>`:''} <button class="btn sm" onclick="mensModal(${m.id})">Editar</button></td></tr>`;
  const cab=`<thead><tr><th>Loja</th><th>Compet.</th><th class="n">Valor</th><th>Vencimento</th><th>Situação</th><th>Pago em</th><th class="n">Valor pago</th><th>Forma</th><th class="noprint"></th></tr></thead>`;
  return `<div class="mini"><div><small>Previsto em ${ymNome(c)}</small><b>${BRL(prev)}</b></div><div><small>Recebido</small><b style="color:var(--pos)">${BRL(rec)}</b></div><div><small>A vencer</small><b style="color:var(--info)">${BRL(ab)}</b></div><div><small>Em atraso</small><b style="color:${at?'var(--neg)':'inherit'}">${BRL(at)}</b></div><div><small>Recebido / previsto</small><b>${prev?PCT(rec/prev):'—'}</b></div></div>
   <div class="toolbar noprint"><button class="btn amber" onclick="gerarModal('${c}')">Gerar mensalidades de ${ymNome(c)}</button><button class="btn" onclick="mensModal(null)">+ Cobrança avulsa</button><span class="mut small">Receber uma mensalidade pode estender a licença da loja na mesma hora.</span></div>
   <div class="card" style="padding:0;overflow:auto"><table>${cab}<tbody>${doMes.map(linha).join('')||`<tr><td colspan="9" class="mut" style="text-align:center;padding:24px">Nenhuma mensalidade em ${ymNome(c)}. Use <b>Gerar mensalidades</b>.</td></tr>`}</tbody></table></div>
   ${antigas.length?`<div class="card" style="padding:0;overflow:auto"><h4 style="padding:12px 14px 0;color:var(--neg)">Em atraso de meses anteriores · ${BRL(soma(antigas,m=>m.valor))}</h4><table>${cab}<tbody>${antigas.map(linha).join('')}</tbody></table></div>`:''}`; }

function gerarModal(c){ const ja=new Set(S.mens.filter(m=>m.competencia===c).map(m=>m.tenant));
  const cand=S.empresas.filter(e=>!e.cancelado_em && e.status!=='teste' && +e.valor_mensal>0 && !ja.has(e.tenant) && (!e.ativada_em || e.ativada_em<=ymFimISO(c)));
  abrirModal(`<h3>Gerar mensalidades de ${ymNome(c)}</h3>
   ${cand.length?`<p class="mut small" style="margin:0 0 8px">Lojas pagantes que ainda não têm cobrança neste mês. Suspensas vêm desmarcadas.</p>
   <table><thead><tr><th></th><th>Loja</th><th>Situação</th><th class="n">Valor</th><th>Vencimento</th></tr></thead><tbody>
   ${cand.map(e=>`<tr><td><input type="checkbox" class="g-sel" value="${esc(e.tenant)}" style="width:auto" ${e.status==='suspensa'?'':'checked'}></td><td>${esc(e.nome)}</td><td>${situacao(e).tag}</td><td class="n">${BRL(e.valor_mensal)}</td><td>${fD(vencDe(c,e.dia_cobranca))}</td></tr>`).join('')}</tbody></table>
   <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn amber" onclick="gerarSalvar('${c}')">Gerar</button></div>`
   :`<p>Nada a gerar: todas as lojas pagantes já têm a cobrança de ${ymNome(c)} (lojas em teste, encerradas ou com valor zero ficam de fora).</p><div style="text-align:right"><button class="btn" onclick="fecharModal()">Fechar</button></div>`}`); }
async function gerarSalvar(c){ const sel=[...document.querySelectorAll('.g-sel:checked')].map(x=>x.value); if(!sel.length){ toast('Marque ao menos uma loja','err'); return; }
  const rows=sel.map(t=>{ const e=S.empresas.find(x=>x.tenant===t); return { tenant:t, competencia:c, valor:+e.valor_mensal||0, vencimento:vencDe(c,e.dia_cobranca) }; });
  const r=await sb().from('mensalidades').upsert(rows,{ onConflict:'tenant,competencia', ignoreDuplicates:true }); if(r.error){ toast(r.error.message,'err'); return; }
  fecharModal(); toast(rows.length+' mensalidade(s) gerada(s)'); await carregar(); render(); }

function receberModal(id){ const m=S.mens.find(x=>x.id===id); if(!m) return; const e=S.empresas.find(x=>x.tenant===m.tenant)||{};
  const base=(e.vence_em && e.vence_em>m.vencimento)? e.vence_em : m.vencimento; const sug=addMeses(base,1);
  const marcar=!!e.vence_em && e.vence_em<sug && !e.cancelado_em;
  abrirModal(`<h3>Receber — ${esc(e.nome||m.tenant)} · ${ymNome(m.competencia)}</h3>
   <p class="mut small" style="margin:0">Valor da cobrança ${BRL(m.valor)} · vencimento ${fD(m.vencimento)} ${mTag(m)}</p>
   <div class="row"><div><label>Data do pagamento</label><input id="p-data" type="date" value="${hojeISO()}"></div><div><label>Valor pago (R$)</label><input id="p-valor" type="number" step="0.01" value="${+m.valor||0}"></div></div>
   <div class="row"><div><label>Forma</label>${selForma('p-forma','pix')}</div><div><label>Observação</label><input id="p-obs" value="${esc(m.obs||'')}" placeholder="ex.: desconto combinado"></div></div>
   <div class="card" style="margin:12px 0 0;background:#f8fafc"><label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:700;color:var(--ink)"><input type="checkbox" id="p-est" style="width:auto" ${marcar?'checked':''}> Estender a licença até</label>
     <input id="p-vence" type="date" value="${sug}" style="margin-top:6px"><div class="mut small" style="margin-top:4px">Licença hoje: ${e.vence_em?fD(e.vence_em):'sem vencimento'} · ${situacao(e).tag}${e.status==='suspensa'&&!e.cancelado_em?' — estender também reativa a loja':''}</div></div>
   <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn amber" onclick="receberSalvar(${id})">Confirmar recebimento</button></div>`); }
async function receberSalvar(id){ const m=S.mens.find(x=>x.id===id); if(!m) return; const e=S.empresas.find(x=>x.tenant===m.tenant)||{};
  const data=$('p-data').value, valor=+$('p-valor').value; if(!data||!(valor>=0)){ toast('Informe data e valor','err'); return; }
  const ok=await registrarPagamento(m.tenant, m.competencia, { pago_em:data, valor_pago:valor, forma:$('p-forma').value, obs:$('p-obs').value.trim() }); if(!ok) return;
  if($('p-est').checked){ const v=$('p-vence').value; if(v){ const upd={ vence_em:v, atualizado_em:new Date().toISOString() };
      if(!e.cancelado_em && (e.status==='suspensa'||e.status==='teste')) upd.status='ativa'; if(!e.ativada_em) upd.ativada_em=data;
      const r=await sb().from('empresas').update(upd).eq('tenant',m.tenant); if(r.error) toast(r.error.message,'err');
      else try{ await sb().from('eventos').insert({ tenant:m.tenant, tipo:'renovada', detalhe:v+' (pagamento)' }); }catch(x){} } }
  fecharModal(); toast('Recebimento registrado'); await carregar(); render(); }
async function estornar(id){ const m=S.mens.find(x=>x.id===id); if(!m||!confirm('Estornar o pagamento de '+nomeDe(m.tenant)+' ('+ymNome(m.competencia)+')? A cobrança volta a ficar em aberto. A licença não é alterada.')) return;
  const r=await sb().from('mensalidades').update({ situacao:'aberta', pago_em:null, valor_pago:null, forma:null }).eq('id',id); if(r.error){ toast(r.error.message,'err'); return; }
  try{ await sb().from('eventos').insert({ tenant:m.tenant, tipo:'pagamento_estornado', detalhe:ymNome(m.competencia) }); }catch(x){}
  toast('Pagamento estornado'); await carregar(); render(); }

function mensModal(id){ const m=id?S.mens.find(x=>x.id===id):null; const c=S.fin.comp||ymHoje();
  abrirModal(`<h3>${m?'Cobrança — '+esc(nomeDe(m.tenant))+' · '+ymNome(m.competencia):'Cobrança avulsa'}</h3>
   ${m?'':`<label>Loja</label>${selLoja('m-tenant','',null)}`}
   <div class="row"><div><label>Competência</label><input id="m-comp" type="month" value="${m?m.competencia:c}" ${m?'disabled':''}></div><div><label>Valor (R$)</label><input id="m-valor" type="number" step="0.01" value="${m?(+m.valor||0):''}"></div></div>
   <div class="row"><div><label>Vencimento</label><input id="m-venc" type="date" value="${m?m.vencimento:vencDe(c,10)}"></div><div><label>Situação</label><select id="m-sit">${['aberta','paga','cancelada'].map(s=>`<option ${m&&m.situacao===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
   <label>Observação</label><input id="m-obs" value="${esc(m?m.obs:'')}">
   ${m&&m.situacao==='paga'?`<p class="mut small">Pago em ${fD(m.pago_em)} · ${BRL(m.valor_pago)} · ${formaNome(m.forma)}. Para mudar o pagamento, use Estornar e receba de novo.</p>`:''}
   <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap">${m?`<button class="btn neg" style="margin-right:auto" onclick="mensExcluir(${m.id})">Excluir</button>`:''}<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn amber" onclick="mensSalvar(${m?m.id:'null'})">Salvar</button></div>`);
  if(!m){ const t=$('m-tenant'); const sync=()=>{ const e=S.empresas.find(x=>x.tenant===t.value); if(e){ if(!$('m-valor').value) $('m-valor').value=+e.valor_mensal||0; $('m-venc').value=vencDe($('m-comp').value||c,e.dia_cobranca); } }; t.onchange=sync; $('m-comp').onchange=sync; sync(); } }
async function mensSalvar(id){ const m=id?S.mens.find(x=>x.id===id):null; const sit=$('m-sit').value;
  const row={ valor:+$('m-valor').value||0, vencimento:$('m-venc').value, obs:$('m-obs').value.trim()||null, situacao:sit };
  if(!row.vencimento){ toast('Informe o vencimento','err'); return; }
  if(sit!=='paga'){ row.pago_em=null; row.valor_pago=null; row.forma=null; }
  else if(!m || m.situacao!=='paga'){ row.pago_em=hojeISO(); row.valor_pago=row.valor; row.forma='outro'; }
  let r; if(m) r=await sb().from('mensalidades').update(row).eq('id',id);
  else { const comp=$('m-comp').value; if(!/^\d{4}-\d{2}$/.test(comp)){ toast('Informe a competência','err'); return; } r=await sb().from('mensalidades').insert({ ...row, tenant:$('m-tenant').value, competencia:comp }); }
  if(r.error){ toast(/duplicate|23505/i.test(r.error.message+(r.error.code||''))?'Essa loja já tem cobrança nesse mês — edite a existente':r.error.message,'err'); return; }
  fecharModal(); toast('Salvo'); await carregar(); render(); }
async function mensExcluir(id){ if(!confirm('Excluir esta cobrança? (Para não cobrar, prefira marcar como cancelada — fica no histórico.)')) return;
  const r=await sb().from('mensalidades').delete().eq('id',id); if(r.error){ toast(r.error.message,'err'); return; } fecharModal(); toast('Excluída'); await carregar(); render(); }

function finCustos(c){ const doMes=S.custos.filter(k=>k.competencia===c).sort((a,b)=>a.data.localeCompare(b.data));
  const tot=soma(doMes,k=>k.valor), ger=soma(doMes.filter(k=>!k.tenant),k=>k.valor), dir=tot-ger;
  const rec=soma(S.mens.filter(m=>m.competencia===c&&m.situacao!=='cancelada'),m=>m.valor);
  const prevRec=S.custos.filter(k=>k.competencia===ymAdd(c,-1)&&k.recorrente).length;
  return `<div class="mini"><div><small>Custos de ${ymNome(c)}</small><b>${BRL(tot)}</b></div><div><small>Gerais (rateados)</small><b>${BRL(ger)}</b></div><div><small>Diretos de lojas</small><b>${BRL(dir)}</b></div><div><small>Faturado no mês</small><b>${BRL(rec)}</b></div><div><small>Resultado do mês</small><b style="color:${rec-tot<0?'var(--neg)':'var(--pos)'}">${BRL(rec-tot)}</b></div></div>
   <div class="toolbar noprint"><button class="btn amber" onclick="custoModal(null)">+ Lançar custo</button>${prevRec?`<button class="btn" onclick="copiarRecorrentes('${c}')">Copiar ${prevRec} recorrente(s) de ${ymNome(ymAdd(c,-1))}</button>`:''}<span class="mut small">Custo sem loja = geral (rateado entre as lojas no relatório de rentabilidade).</span></div>
   <div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Loja</th><th class="n">Valor</th><th>Recorrente</th><th class="noprint"></th></tr></thead><tbody>
   ${doMes.map(k=>`<tr><td>${fD(k.data)}</td><td>${esc(catNome(k.categoria))}</td><td>${esc(k.descricao||'')}</td><td>${k.tenant?esc(nomeDe(k.tenant)):'<span class="mut">Geral</span>'}</td><td class="n">${BRL(k.valor)}</td><td>${k.recorrente?'<span class="tag info">mensal</span>':''}</td><td class="noprint" style="white-space:nowrap"><button class="btn sm" onclick="custoModal(${k.id})">Editar</button></td></tr>`).join('')||`<tr><td colspan="7" class="mut" style="text-align:center;padding:24px">Nenhum custo em ${ymNome(c)}.</td></tr>`}
   ${doMes.length?`<tr class="tot"><td colspan="4">Total</td><td class="n">${BRL(tot)}</td><td colspan="2"></td></tr>`:''}</tbody></table></div>`; }
function custoModal(id){ const k=id?S.custos.find(x=>x.id===id):null; const c=S.fin.comp||ymHoje(); const dPad=c===ymHoje()?hojeISO():c+'-01';
  abrirModal(`<h3>${k?'Editar custo':'Lançar custo'}</h3>
   <div class="row"><div><label>Data</label><input id="k-data" type="date" value="${k?k.data:dPad}"></div><div><label>Valor (R$)</label><input id="k-valor" type="number" step="0.01" value="${k?(+k.valor||0):''}"></div></div>
   <div class="row"><div><label>Categoria</label><select id="k-cat">${CATS.map(([v,l])=>`<option value="${v}" ${k&&k.categoria===v?'selected':''}>${l}</option>`).join('')}</select></div><div><label>Loja</label>${selLoja('k-tenant',k?k.tenant:'','Geral (rateado entre as lojas)')}</div></div>
   <label>Descrição</label><input id="k-desc" value="${esc(k?k.descricao:'')}" placeholder="ex.: Supabase Pro, Focus NFe plano Growth">
   <label style="display:flex;gap:6px;align-items:center;font-weight:500;margin-top:10px"><input type="checkbox" id="k-rec" style="width:auto" ${k&&k.recorrente?'checked':''}> Recorrente (todo mês — aparece o botão para copiar no mês seguinte)</label>
   <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap">${k?`<button class="btn neg" style="margin-right:auto" onclick="custoExcluir(${k.id})">Excluir</button>`:''}<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn amber" onclick="custoSalvar(${k?k.id:'null'})">Salvar</button></div>`); }
async function custoSalvar(id){ const data=$('k-data').value, valor=+$('k-valor').value; if(!data||!(valor>0)){ toast('Informe data e valor','err'); return; }
  const row={ data, competencia:data.slice(0,7), valor, categoria:$('k-cat').value, tenant:$('k-tenant').value||null, descricao:$('k-desc').value.trim()||null, recorrente:$('k-rec').checked };
  const r= id? await sb().from('custos').update(row).eq('id',id) : await sb().from('custos').insert(row); if(r.error){ toast(r.error.message,'err'); return; }
  fecharModal(); toast('Custo salvo'); if(row.competencia!==S.fin.comp) S.fin.comp=row.competencia; await carregar(); render(); }
async function custoExcluir(id){ if(!confirm('Excluir este custo?')) return; const r=await sb().from('custos').delete().eq('id',id); if(r.error){ toast(r.error.message,'err'); return; } fecharModal(); toast('Excluído'); await carregar(); render(); }
async function copiarRecorrentes(c){ const ant=S.custos.filter(k=>k.competencia===ymAdd(c,-1)&&k.recorrente); const ja=S.custos.filter(k=>k.competencia===c);
  const chave=k=>[k.categoria,k.descricao||'',k.tenant||''].join('|'); const tem=new Set(ja.map(chave));
  const rows=ant.filter(k=>!tem.has(chave(k))).map(k=>({ data:vencDe(c,+k.data.slice(8,10)), competencia:c, valor:k.valor, categoria:k.categoria, tenant:k.tenant, descricao:k.descricao, recorrente:true }));
  if(!rows.length){ toast('Os recorrentes já estão lançados em '+ymNome(c)); return; }
  if(!confirm('Lançar '+rows.length+' custo(s) recorrente(s) em '+ymNome(c)+' — total '+BRL(soma(rows,k=>k.valor))+'?')) return;
  const r=await sb().from('custos').insert(rows); if(r.error){ toast(r.error.message,'err'); return; } toast('Recorrentes copiados'); await carregar(); render(); }

/* =====================================================================
   CONTROLE GERENCIAL (v1.5) — histórico de contrato, fechamento do mês,
   uso diário das lojas e atendimentos de suporte
   ===================================================================== */
const TIPOS_CONTRATO = [['inicio','Início'],['reajuste','Reajuste'],['upgrade','Upgrade (plano maior)'],['downgrade','Downgrade (plano menor)'],['ajuste','Ajuste / desconto'],['cancelamento','Cancelamento'],['reativacao','Reativação']];
const tipoContratoNome = t => (TIPOS_CONTRATO.find(x=>x[0]===t)||[,t||'—'])[1];
const TIPO_COR = { inicio:'info', reajuste:'warn', upgrade:'pos', downgrade:'neg', ajuste:'mut', cancelamento:'neg', reativacao:'pos' };
const CANAIS = [['whatsapp','WhatsApp'],['telefone','Telefone'],['remoto','Acesso remoto'],['presencial','Presencial'],['email','E-mail']];
const MOTIVOS = [['duvida','Dúvida de uso'],['erro','Erro / problema'],['fiscal','Fiscal (NF-e / NFC-e)'],['implantacao','Implantação'],['treinamento','Treinamento'],['melhoria','Pedido de melhoria'],['financeiro','Financeiro / cobrança'],['outro','Outro']];
const nomeDeLista = (lista,k) => (lista.find(x=>x[0]===k)||[,k||'—'])[1];
const selDe = (id,lista,v) => `<select id="${id}">${lista.map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${l}</option>`).join('')}</select>`;
const HMIN = m => { m=Math.round(+m||0); const h=Math.floor(m/60), r=m%60; return h?(h+'h'+(r?String(r).padStart(2,'0'):'')):(r+' min'); };
const addDias = (isoD,n) => { const [a,m,d]=isoD.split('-').map(Number); return iso(new Date(a,m-1,d+n)); };

async function buscarTudo(mk){ let out=[]; const passo=1000;
  for(let i=0,de=0;i<60;i++,de+=passo){ const r=await mk().range(de,de+passo-1); if(r.error) return { data:null, error:r.error };
    out=out.concat(r.data||[]); if(!r.data || r.data.length<passo) break; }
  return { data:out, error:null }; }
async function carregarGerencial(c){
  const desde=addDias(hojeISO(),-400);
  const [h,f,u,a,k]=await Promise.all([
    buscarTudo(()=>c.from('contrato_historico').select('*').order('vigente_desde').order('id')),
    c.from('fechamentos').select('*').order('competencia'),
    buscarTudo(()=>c.from('uso_diario').select('*').gte('dia',desde).order('dia')),
    buscarTudo(()=>c.from('atendimentos').select('*').order('data',{ascending:false}).order('id',{ascending:false})),
    c.from('config').select('*') ]);
  const err=h.error||f.error||u.error||a.error||k.error;
  S.gerOk=!err; S.gerErr=err?err.message:'';
  S.hist=h.data||[]; S.fech=f.data||[]; S.uso=u.data||[]; S.atend=a.data||[];
  S.cfg={}; (k.data||[]).forEach(x=>{ S.cfg[x.chave]=x.valor; });
  S.histPor={}; S.hist.forEach(x=>{ (S.histPor[x.tenant]=S.histPor[x.tenant]||[]).push(x); });
  Object.values(S.histPor).forEach(l=>l.sort((x,y)=>x.vigente_desde.localeCompare(y.vigente_desde)||(x.id-y.id)));
  S.usoPor={}; S.uso.forEach(x=>{ (S.usoPor[x.tenant]=S.usoPor[x.tenant]||[]).push(x); });
  Object.values(S.usoPor).forEach(l=>l.sort((x,y)=>x.dia.localeCompare(y.dia))); }

/* ---- uso diário ---- */
function usoVendasDia(lista){ // devolve [{dia, vendas, qtd}] — usa extras.vendas_dia quando existir; senão, diferença do acumulado do mês
  const out=[]; let ant=null;
  for(const u of lista){ const ex=u.extras||{}; let v, q;
    if(ex.vendas_dia!=null){ v=+ex.vendas_dia||0; q=+ex.qtd_vendas_dia||0; }
    else { const mesmoMes = ant && ant.dia.slice(0,7)===u.dia.slice(0,7);
      v = mesmoMes ? Math.max(0,(+u.vendas_mes||0)-(+ant.vendas_mes||0)) : (+u.vendas_mes||0);
      q = mesmoMes ? Math.max(0,(+u.qtd_vendas_mes||0)-(+ant.qtd_vendas_mes||0)) : (+u.qtd_vendas_mes||0); }
    out.push({ dia:u.dia, vendas:v, qtd:q }); ant=u; }
  return out; }
function diasAtivos(tenant, ini, fim){ return ((S.usoPor&&S.usoPor[tenant])||[]).filter(u=>u.dia>=ini && u.dia<=fim).length; }
function faixaUso(tenant, n){ const fim=hojeISO(); const set=new Set(((S.usoPor&&S.usoPor[tenant])||[]).map(u=>u.dia)); let h='';
  for(let i=n-1;i>=0;i--){ const d=addDias(fim,-i); h+=`<i class="${set.has(d)?'on':''}" title="${fD(d)}${set.has(d)?' · usou':''}"></i>`; }
  return `<span class="strip">${h}</span>`; }
function relUso(){ const ini=perIni(), fim0=perFim(), hj=hojeISO(), fim=fim0<hj?fim0:hj;
  const lojas=S.empresas.filter(e=>!e.cancelado_em || e.cancelado_em>=ini);
  const rows=lojas.map(e=>{ const todos=(S.usoPor[e.tenant]||[]); const lista=todos.filter(u=>u.dia>=ini && u.dia<=fim);
    const desde=[ini, (ativadaDe(e)||String(e.criado_em||'').slice(0,10)||ini)].sort().pop(); const periodoDias=Math.max(0, difDias(fim, desde)+1);
    const vd=usoVendasDia(todos).filter(x=>x.dia>=ini && x.dia<=fim);
    const porMes={}; lista.forEach(u=>{ const m=u.dia.slice(0,7), ex=u.extras||{}; const p=porMes[m]||(porMes[m]={nfe:0,nfce:0,orc:0});
      p.nfe=Math.max(p.nfe,+ex.nfe_mes||0); p.nfce=Math.max(p.nfce,+ex.nfce_mes||0); p.orc=Math.max(p.orc,+ex.orcamentos_mes||0); });
    const tem=lista.some(u=>u.extras&&Object.keys(u.extras).length);
    const a14=diasAtivos(e.tenant,addDias(hj,-13),hj), p14=diasAtivos(e.tenant,addDias(hj,-27),addDias(hj,-14));
    const ult=todos.length?todos[todos.length-1].dia:null;
    return { loja:e.nome, sit:tg(...sitTxt(e)), dias:lista.length, periodo:periodoDias, pct:periodoDias?lista.length/periodoDias:null,
      aberturas:soma(lista,u=>u.aberturas), media:lista.length?soma(lista,u=>u.aberturas)/lista.length:null,
      vendas:soma(vd,x=>x.vendas), qtd:soma(vd,x=>x.qtd),
      nfe:tem?soma(Object.values(porMes),p=>p.nfe):null, nfce:tem?soma(Object.values(porMes),p=>p.nfce):null, orc:tem?soma(Object.values(porMes),p=>p.orc):null,
      usuarios:lista.length?Math.max(...lista.map(u=>+((u.extras||{}).usuarios_dia)||0))||null:null,
      faixa:hx(faixaUso(e.tenant,28), a14+'/14 dias'), tend:(a14||p14)?tg((a14-p14>0?'+':'')+(a14-p14)+' dias','' + (a14<p14?'neg':a14>p14?'pos':'mut')):null,
      ult, _sem:ult?difDias(hj,ult):9999 }; }).sort((a,b)=>b._sem-a._sem || a.dias-b.dias);
  const comUso=rows.filter(r=>r.dias>0), parados=rows.filter(r=>r._sem>=7);
  const pcts=rows.filter(r=>r.pct!=null&&r.periodo>0);
  return { titulo:'Uso das lojas', desc:'Cada dia em que o sistema da loja abriu (ou conferiu a licença) vira um dia de uso. Vendas por dia vêm do próprio sistema da loja; NF-e, NFC-e e orçamentos aparecem depois que a loja atualizar o GestãoPro. A faixa mostra os últimos 28 dias (verde = usou).',
    kpis:[['Lojas com uso no período',NUM(comUso.length)],['Uso médio',pcts.length?PCT(soma(pcts,r=>r.pct)/pcts.length)+' dos dias':'—'],['Aberturas no período',NUM(soma(rows,r=>r.aberturas))],['Vendas das lojas (período)',BRL(soma(rows,r=>r.vendas))],['Paradas há 7+ dias',NUM(parados.length),parados.length?'var(--neg)':'']],
    blocos:[ { titulo:'Por loja (menos uso primeiro)', cols:[['loja','Loja','b'],['sit','Situação','tag'],['faixa','Últimos 28 dias','html'],['tend','14d x 14d ant.','tag'],['dias','Dias com uso','int'],['pct','% do período','pct'],['aberturas','Aberturas','int'],['vendas','Vendas','brl'],['qtd','Qtd vendas','int'],['nfe','NF-e','int'],['nfce','NFC-e','int'],['orc','Orçamentos','int'],['usuarios','Usuários/dia (máx)','int'],['ult','Último uso','date']], rows, total:{dias:soma(rows,r=>r.dias),aberturas:soma(rows,r=>r.aberturas),vendas:soma(rows,r=>r.vendas),qtd:soma(rows,r=>r.qtd)}, vazio:'Nenhuma loja.' } ],
    nota:S.uso.length?'Dados de uso guardados pelos últimos 400 dias.':'Ainda não há dados de uso: eles começam a chegar quando a função "licenca" da Central for publicada de novo (v1.5) e as lojas abrirem o sistema.' }; }

      { titulo:'Por canal', cols:[['canal','Canal','b'],['qtd','Atendimentos','int']], rows:Object.entries(pc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({canal:nomeDeLista(CANAIS,k),qtd:v})), vazio:'—' } ] }; }
function barrasNum(labels, vals, nome, fmt){ // barras simples para números que não são R$
  const W=760,H=200,L=50,R=8,T=10,B=26, pw=W-L-R, ph=H-T-B; const max=niceMax(Math.max(0,...vals)); const n=labels.length; const gw=pw/Math.max(n,1), bw=Math.max(3,Math.min(26,gw*0.6));
  let g=''; for(let i=0;i<=4;i++){ const v=max*i/4, yy=T+ph-(v/max)*ph; g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${i?'#eef2f7':'#94a3b8'}"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="10.5" fill="#64748b">${fmt(v)}</text>`; }
  const passo=n>12?Math.ceil(n/12):1; let b='';
  labels.forEach((lab,i)=>{ const v=+vals[i]||0, x=L+gw*i+(gw-bw)/2, yy=T+ph-(v/max)*ph, h=T+ph-yy, r=Math.min(4,h,bw/2);
    if(h>0) b+=`<path class="bar" d="M${x},${T+ph} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${T+ph} Z" style="fill:var(--s1)"><title>${esc(ymNome(lab))} · ${esc(nome)}: ${fmt(v)}</title></path>`;
    if(i%passo===0) b+=`<text x="${L+gw*i+gw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#64748b">${esc(ymNome(lab))}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(nome)} por mês">${g}${b}</svg></div>`; }

  return { competencia:c, mrr:soma(at,e=>valorEm(e,c)), clientes:at.length, novos:novos.length, cancelados:canc.length, churn:antA.length?canc.length/antA.length:null,
    faturado, recebido, impostos, custos, resultado:faturado-custos, margem:faturado?(faturado-custos)/faturado:null, a_receber_ate_fim:aberto,

function telaFechamento(){ if(!S.gerOk) return avisoSqlGer();

async function fechFechar(c){ if(!/^\d{4}-\d{2}$/.test(c||'')){ toast('Escolha o mês','err'); return; }

    d.lojas=comPer(ini,fim,relLojas).blocos[1].rows.filter(r=>r.plano!==undefined);
    d.cats=comPer(ini,fim,relCustos).blocos[1].rows; }
  const sa=comPer(ini,fim,relSaaS); const rs=sa.blocos[1].rows; const ult=rs[rs.length-1]||{};
  d.mrrIni=soma(ativosEm(antes),e=>S.gerOk?valorEm(e,antes):(+e.valor_mensal||0)); d.mrrFim=ult.mrr||0; d.ativos=ult.ativos||0;
  d.novos=soma(rs,r=>r.novos); d.canc=soma(rs,r=>r.canc); d.exp=soma(rs,r=>r.exp||0); d.contr=soma(rs,r=>r.contr||0); d.mperd=soma(rs,r=>r.mperd);
  d.nrr=d.mrrIni?(d.mrrIni+d.exp-d.contr-d.mperd)/d.mrrIni:null; d.cancLista=sa.blocos[2].rows;
  if(S.gerOk){ const L=atendPeriodo(ini+'-01',ymFimISO(fim)); d.atend=L.length; d.minSup=soma(L,a=>a.minutos); d.custoSup=valorHora()?d.minSup/60*valorHora():null;
    const pm={}; L.forEach(a=>{ pm[a.motivo]=(pm[a.motivo]||0)+(+a.minutos||0); }); d.topMotivo=Object.entries(pm).sort((a,b)=>b[1]-a[1])[0]||null;
    const pl={}; L.forEach(a=>{ if(a.tenant) pl[a.tenant]=(pl[a.tenant]||0)+(+a.minutos||0); }); d.topSup=Object.entries(pl).sort((a,b)=>b[1]-a[1])[0]||null;
    d.uso=comPer(ini,fim,relUso).blocos[0].rows; const up=d.uso.filter(r=>r.periodo>0 && r.sit.t!=='encerrada'); d.usoMedio=up.length?soma(up,r=>r.pct)/up.length:null;
    d.contratos=comPer(ini,fim,relContratos).blocos[0].rows; }

const varPct = (a,b) => (a==null||b==null||!isFinite(a)||!isFinite(b)||b===0) ? null : (a-b)/Math.abs(b);
function setaVar(v, bomSobe, pp){ if(v==null||!isFinite(v)) return '<span class="mut">—</span>'; if(Math.abs(v)<0.0005) return '<span class="mut">= estável</span>';
  const sobe=v>0, bom=bomSobe==null?null:(sobe===bomSobe); const cor=bom==null?'var(--mut)':(bom?'var(--pos)':'var(--neg)');
  const txt=pp?(v*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+' p.p.':PCT(Math.abs(v)); return `<b style="color:${cor}">${sobe?'▲':'▼'} ${pp&&sobe?'+':''}${txt}</b>`; }

function insightsAnalise(a,p,rotAnt){ const I=[]; const add=(nivel,texto,acao)=>I.push({ nivel, texto, acao });
  const nomeT=t=>nomeDe(t);
  if(S.finOk){
    const vf=varPct(a.fat,p.fat);
    if(!a.fat) add('atencao','Nenhuma mensalidade faturada no período.','Gerar as mensalidades em Financeiro › Mensalidades.');
    else if(vf==null) add('info',`Receita faturada de <b>${BRL(a.fat)}</b> (sem faturamento no período anterior para comparar).`);
    else add(vf>=0.02?'bom':vf<=-0.05?'alerta':'info',`Receita faturada de <b>${BRL(a.fat)}</b> — ${setaVar(vf,true)} em relação a ${rotAnt} (${BRL(p.fat)}).`, vf<=-0.05?'Entender a queda: cancelamentos, descontos ou mensalidades não geradas.':null);

      else add(a.marg<0.3?'atencao':'bom',`Resultado de <b>${BRL(a.res)}</b>, margem de <b>${PCT(a.marg)}</b> ${p.marg!=null?'('+setaVar(a.marg-p.marg,true,true)+' vs '+rotAnt+')':''}.`, a.marg<0.3?'Margem abaixo de 30%: revisar custos ou reajustar planos.':null); }
    if(a.fat){ const cob=a.rec/a.fat; add(cob<0.8?'atencao':cob>=0.95?'bom':'info',`Entrou no caixa <b>${BRL(a.rec)}</b> — ${PCT(cob)} do faturado.${a.emDia!=null?' '+PCT(a.emDia)+' dos pagamentos chegaram em dia.':''}`, cob<0.8?'Cobrar as mensalidades em aberto (Relatórios › Inadimplência).':null); }
    const atr=mensAtrasadas(); if(atr.length){ const pl={}; atr.forEach(m=>{ pl[m.tenant]=(pl[m.tenant]||0)+(+m.valor||0); }); const top=Object.entries(pl).sort((x,y)=>y[1]-x[1])[0];

    lj.filter(r=>r.res2!=null && r.res2<0).forEach(r=>add('atencao',`<b>${esc(r.loja)}</b> dá prejuízo depois do suporte (${BRL(r.res2)}; ${HMIN(r.horas*60)} de atendimento).`,'Revisar o plano/valor de '+esc(r.loja)+' ou treinar a equipe para reduzir chamados.'));
    if(a.cats&&a.cats.length){ const c0=a.cats[0]; const vc=varPct(a.ct,p.ct); add(vc!=null&&vc>0.15?'atencao':'info',`Custos de <b>${BRL(a.ct)}</b> ${vc!=null?'('+setaVar(vc,false)+')':''}; maior peso: <b>${esc(c0.cat)}</b> (${PCT(c0.pct)}).`, vc!=null&&vc>0.15?'Custos subiram mais de 15%: conferir os lançamentos de '+esc(c0.cat)+'.':null); }
  }
  const vm=varPct(a.mrrFim,a.mrrIni);
  add(vm==null?'info':vm>=0?'bom':'alerta',`Receita mensal recorrente (MRR) terminou em <b>${BRL(a.mrrFim)}</b>${vm!=null?' — '+setaVar(vm,true)+' no período':''}${a.nrr!=null?'; retenção de receita (NRR) de <b>'+PCT(a.nrr)+'</b>':''}.`, vm!=null&&vm<0?'Recuperar receita: reativar clientes e revisar descontos.':null);
  if(a.novos||a.canc) add(a.canc>a.novos?'alerta':'bom',`<b>${a.novos}</b> cliente(s) novo(s) e <b>${a.canc}</b> cancelamento(s)${a.cancLista&&a.cancLista.length?' ('+a.cancLista.map(c=>esc(c.loja)+(c.motivo?': '+esc(c.motivo):'')).join('; ')+')':''}. Clientes ativos no fim: <b>${a.ativos}</b>.`, a.canc>a.novos?'Cancelamentos superaram as vendas: priorizar retenção e prospecção.':null);
  else add('info',`Nenhum cliente novo nem cancelamento. Clientes ativos no fim: <b>${a.ativos}</b>.`,'Prospectar novos clientes (meta sugerida: 1 por mês).');
  const testes=S.empresas.filter(e=>!e.cancelado_em && e.status==='teste'); if(testes.length) add('info',`<b>${testes.length}</b> loja(s) em teste: ${testes.map(e=>esc(e.nome)+(e.vence_em?' (até '+fD(e.vence_em)+')':'')).join(', ')}.`,'Acompanhar o uso das lojas em teste e fazer a proposta antes do fim do teste.');
  const venc=S.empresas.filter(e=>{ const s=situacao(e); return !s.enc && !s.bloq && e.vence_em && s.dias!=null && s.dias<=10; }); if(venc.length) add('atencao',`Licença vencendo em até 10 dias: ${venc.map(e=>esc(e.nome)+' ('+fD(e.vence_em)+')').join(', ')}.`,'Renovar ou cobrar antes do vencimento.');
  if(S.gerOk){

      add(dn?'atencao':'info',`${a.contratos.length} mudança(s) de contrato no período (${r} reajuste(s)${dn?', '+dn+' downgrade(s)':''}); expansão ${BRL(a.exp)}, contração ${BRL(a.contr)}.`, dn?'Entender o motivo dos downgrades.':null); }

      const top=a.uso.filter(r=>r.dias>0).sort((x,y)=>y.pct-x.pct)[0]; if(top) add('bom',`Loja que mais usa: <b>${esc(top.loja)}</b> — ${top.dias} dia(s) de uso (${PCT(top.pct)} do período)${top.vendas?', '+BRL(top.vendas)+' em vendas':''}.`);

  const ordem={ alerta:0, atencao:1, bom:2, info:3 }; return I.sort((x,y)=>ordem[x.nivel]-ordem[y.nivel]); }

function telaAnalitico(){ const A=S.ana; if(!A){ return `<div class="card">Nenhum relatório gerado. <button class="btn amber" onclick="analiticoModal()">Gerar relatório analítico</button></div>`; }
  const n=ymLista(A.ini,A.fim).length; const pIni=ymAdd(A.ini,-n), pFim=ymAdd(A.ini,-1);
  const a=dadosAnalise(A.ini,A.fim), p=dadosAnalise(pIni,pFim);
  const rotAnt = n===1 ? ymNome(pIni) : ymNome(pIni)+'–'+ymNome(pFim);
  const ins=insightsAnalise(a,p,rotAnt); const ICN={ alerta:'!', atencao:'▲', bom:'✓', info:'i' };

  k('MRR no fim do período',a.mrrFim,p.mrrFim,BRL,true); k('Clientes ativos no fim',a.ativos,p.ativos,NUM,true); k('Clientes novos',a.novos,p.novos,NUM,true); k('Cancelamentos',a.canc,p.canc,NUM,false);
  k('Expansão (reajustes/upgrades)',a.exp,p.exp,BRL,true); k('Contração (descontos/downgrades)',a.contr,p.contr,BRL,false); k('Retenção de receita (NRR)',a.nrr,p.nrr,PCT,true,true);
  if(S.gerOk){ k('Atendimentos',a.atend,p.atend,NUM,false); k('Horas de suporte',a.minSup/60,p.minSup/60,v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:1})+'h',false); if(valorHora()) k('Custo do suporte',a.custoSup,p.custoSup,BRL,false); k('Uso médio das lojas',a.usoMedio,p.usoMedio,PCT,true,true); }
  const kRows=K.map(x=>({ ind:x.l, va:x.va==null?'—':x.fmt(x.va), vp:x.vp==null?'—':x.fmt(x.vp), vr:hx(setaVar(x.pp?((x.va!=null&&x.vp!=null)?x.va-x.vp:null):varPct(x.va,x.vp),x.bomSobe,x.pp), (()=>{ const v=x.pp?((x.va!=null&&x.vp!=null)?x.va-x.vp:null):varPct(x.va,x.vp); return v==null?'':(x.pp?(v*100).toFixed(1).replace('.',',')+' p.p.':(v*100).toFixed(1).replace('.',',')+'%'); })()) }));
  const tiles=[['Receita faturada',S.finOk?BRL(a.fat):'—',S.finOk?varPct(a.fat,p.fat):null,true],['Resultado',S.finOk?BRL(a.res):'—',S.finOk?varPct(a.res,p.res):null,true],['Margem',S.finOk?PCT(a.marg):'—',(S.finOk&&a.marg!=null&&p.marg!=null)?a.marg-p.marg:null,true,true],['MRR',BRL(a.mrrFim),varPct(a.mrrFim,p.mrrFim),true],['Clientes ativos',NUM(a.ativos),varPct(a.ativos,p.ativos),true],['Suporte',S.gerOk?HMIN(a.minSup):'—',S.gerOk?varPct(a.minSup,p.minSup):null,false]];

  const gIni = n>=6 ? A.ini : ymAdd(A.fim,-5); const gMeses=ymLista(gIni,A.fim);

  blocos.push({ titulo:'Indicadores — '+perExt(A.ini,A.fim)+' x '+rotAnt, cols:[['ind','Indicador','b'],['va',n===1?ymNome(A.ini):'Período','txt'],['vp',rotAnt,'txt'],['vr','Variação','html']], rows:kRows });

    kpis:tiles.map(t=>[t[0],t[1]]), blocos:[{ titulo:'Resumo executivo', cols:[['n','Nível','txt'],['t','Constatação','txt'],['a','Ação sugerida','txt']], rows:ins.map(x=>({ n:{alerta:'Alerta',atencao:'Atenção',bom:'Bom',info:'Info'}[x.nivel], t:x.texto.replace(/<[^>]+>/g,''), a:x.acao?x.acao.replace(/<[^>]+>/g,''):'' })) }, ...blocos.filter(b=>b.cols)] };
  return `<div class="toolbar noprint"><button class="btn" onclick="ir('relf', S.rel||'dre')">← Relatórios</button><button class="btn" onclick="analiticoModal()">Trocar período</button>
     <div style="margin-left:auto;display:flex;gap:6px"><button class="btn" onclick="window.print()">Imprimir / PDF</button><button class="btn" onclick="exportarCSV()">Exportar planilha (CSV)</button></div></div>

     <p>Comparado com ${rotAnt} · emitido em ${fDH(new Date().toISOString())}${n===1&&S.gerOk?' · '+(fechado?'<b style="color:#86efac">mês fechado</b>':(A.ini<ymHoje()?'<b style="color:#fcd34d">mês ainda não fechado</b>':'<b style="color:#fcd34d">mês em andamento</b>')):''}</p></div></div>

   ${acoes.length?`<div class="card"><h4>Próximos passos</h4><ol class="an-acoes">${acoes.map(x=>`<li class="${x.nivel}">${x.acao}</li>`).join('')}</ol></div>`:''}
   ${blocos.map(b=>b.cols?tabelaHTML(b):`<div class="card"><h4>${esc(b.titulo)}</h4>${b.html}</div>`).join('')}
   <p class="mut small">Inadimplência, licenças vencendo e saúde das lojas mostram a situação de hoje. ${!S.gerOk?'Uso, suporte e histórico de contrato aparecem depois de rodar o central.sql v1.5.':''}</p>`; }
